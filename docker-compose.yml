# Local development dependencies for MedScribe AI.
#
#   docker compose up -d        # start Postgres on localhost:5433 and MinIO on localhost:9000 (console 9001)
#   docker compose down         # stop (data kept in the named volume)
#   docker compose down -v      # stop and wipe data
#
# Port 5433 is used on purpose so this never collides with a Postgres
# already installed on the host at 5432. The app's `local2` profile
# points at 5433 by default.
services:
  postgres:
    image: postgres:17-alpine
    container_name: medscribe-postgres
    environment:
      POSTGRES_DB: medscribe
      POSTGRES_USER: medscribe
      POSTGRES_PASSWORD: medscribe
    ports:
      - "5433:5432"
    volumes:
      - medscribe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medscribe -d medscribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for Baymax page images and crops (S3 API) — local dev only; production uses real AWS S3.
  # bitnamilegacy/minio, pinned BY DIGEST to a multi-arch index (linux/amd64 + linux/arm64). MinIO withdrew its
  # own public images (quay.io answers "unauthorized", Docker Hub 404), and the GHCR mirror was arm64-only.
  # Bitnami creates the `baymax` bucket itself (MINIO_DEFAULT_BUCKETS, private), so no mc init container.
  # Runs as uid 1001, so it gets its own volume: the old root-owned medscribe-minio volume is not writable by it.
  minio:
    image: docker.io/bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: medscribe-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: baymax
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - medscribe-minio-data:/bitnami/minio/data

volumes:
  medscribe-pgdata:
  medscribe-minio-data:
