# Local development dependencies for MedScribe AI.
#
#   docker compose up -d        # start Postgres on localhost:5433 and MinIO on localhost:9000 (console 9001)
#   docker compose down         # stop (data kept in the named volume)
#   docker compose down -v      # stop and wipe data
#
# Port 5433 is used on purpose so this never collides with a Postgres
# already installed on the host at 5432. The app's `local2` profile
# points at 5433 by default.
services:
  postgres:
    image: postgres:17-alpine
    container_name: medscribe-postgres
    environment:
      POSTGRES_DB: medscribe
      POSTGRES_USER: medscribe
      POSTGRES_PASSWORD: medscribe
    ports:
      - "5433:5432"
    volumes:
      - medscribe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medscribe -d medscribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for Baymax page images and crops (S3 API). Bucket `baymax` is created by minio-init.
  minio:
    # Mirrored to GHCR and pinned BY DIGEST: quay.io began refusing quay.io/minio/minio on 2026-09-25
    # ("unauthorized", every tag), which blocked every merge. Same MinIO version, different registry.
    # A tag can be repointed at different bytes; a digest cannot. Source tag: RELEASE.2025-09-07T16-13-09Z.
    image: ghcr.io/khondokertanvirhossain/elioo-health/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: medscribe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - medscribe-minio:/data

  minio-init:
    # Mirrored and digest-pinned for the same reason. Source tag: RELEASE.2025-08-13T08-35-41Z.
    image: ghcr.io/khondokertanvirhossain/elioo-health/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done;
      mc mb -p local/baymax;
      mc anonymous set none local/baymax;
      echo 'bucket baymax ready'"

volumes:
  medscribe-pgdata:
  medscribe-minio:
