<title>Medioo Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: an iPhone running Medioo — Messages grammar for the conversation, iOS chrome everywhere else, the wall calendar for papers. */
:root {
  --bg: #ffffff;
  --bg2: #f2f2f7;
  --bg3: #ffffff;
  --label: #000000;
  --label2: rgba(60, 60, 67, 0.82);
  --label3: rgba(60, 60, 67, 0.36);
  --sep: rgba(60, 60, 67, 0.18);
  --fill: rgba(120, 120, 128, 0.12);
  --recv: #e9e9eb;
  --recv-ink: #000000;
  --sent: #06788a;
  --sent-ink: #ffffff;
  --tint: #06788a;
  --tint-soft: rgba(6, 120, 138, 0.12);
  --mio-bg: #dff0f2;
  --wordmark: url("medioo-light.svg");
  --on-tint: #ffffff; --tint-ink: #045f6d; --now-ink: #a3201a;
  --green: #34c759;
  --now: #d12c24; --now-fill: #d12c24;
  --now-soft: rgba(224, 53, 43, 0.12);
  --week: #92400e;
  --week-soft: rgba(255, 149, 0, 0.16);
  --unk-soft: rgba(120, 120, 128, 0.14);
  --paper: #fffdf8;
  --paper-ink: #2b2b2b;
  --bar: rgba(249, 249, 249, 0.84);
  --scrim: rgba(0, 0, 0, 0.32);
  --stage: #d9dde3;
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans Bengali", "Segoe UI", Roboto, sans-serif;
  --bnf: "Noto Sans Bengali", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: "Noto Sans Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --bg2: #000000; --bg3: #1c1c1e; --label: #ffffff; --label2: rgba(235, 235, 245, 0.78); --label3: rgba(235, 235, 245, 0.32);
  --sep: rgba(84, 84, 88, 0.6); --fill: rgba(120, 120, 128, 0.24); --recv: #26252a; --recv-ink: #ffffff; --sent: #06788a;
  --tint: #5cc8d6; --tint-soft: rgba(92, 200, 214, 0.16); --mio-bg: #1d3b41; --wordmark: url("medioo-dark.svg"); --on-tint: #062a30; --tint-ink: var(--tint); --now-ink: var(--now); --green: #30d158; --now: #ff8a80; --now-fill: #d93229; --now-soft: rgba(255, 90, 79, 0.18);
  --week: #ffb340; --week-soft: rgba(255, 159, 10, 0.2); --unk-soft: rgba(120, 120, 128, 0.26); --paper: #f4efe4;
  --bar: rgba(22, 22, 24, 0.84); --scrim: rgba(0, 0, 0, 0.5); --stage: #0b0c0e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #000000; --bg2: #000000; --bg3: #1c1c1e; --label: #ffffff; --label2: rgba(235, 235, 245, 0.78); --label3: rgba(235, 235, 245, 0.32);
  --sep: rgba(84, 84, 88, 0.6); --fill: rgba(120, 120, 128, 0.24); --recv: #26252a; --recv-ink: #ffffff; --sent: #06788a;
  --tint: #5cc8d6; --tint-soft: rgba(92, 200, 214, 0.16); --mio-bg: #1d3b41; --wordmark: url("medioo-dark.svg"); --on-tint: #062a30; --tint-ink: var(--tint); --now-ink: var(--now); --green: #30d158; --now: #ff8a80; --now-fill: #d93229; --now-soft: rgba(255, 90, 79, 0.18);
  --week: #ffb340; --week-soft: rgba(255, 159, 10, 0.2); --unk-soft: rgba(120, 120, 128, 0.26); --paper: #f4efe4;
  --bar: rgba(22, 22, 24, 0.84); --scrim: rgba(0, 0, 0, 0.5); --stage: #0b0c0e; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--label); font: 17px/1.5 var(--sys); -webkit-font-smoothing: antialiased; }
::selection { background: var(--tint-soft); }
button, input { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; border-radius: 10px; }
svg.i { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Stage */
.stage { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.jump { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 760px; font-family: var(--bnf); }
.jump button { border: 0; background: var(--bg3); border-radius: 999px; padding: 6px 14px; font-size: 14px; line-height: 1.4; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.jump button:active { transform: scale(.96); }
.jump button[aria-pressed="true"] { background: var(--label); color: var(--bg); }
.phone { width: 393px; max-width: 100%; height: 852px; max-height: calc(100vh - 110px); min-height: 640px; position: relative; overflow: hidden; background: #000; border-radius: 54px; box-shadow: 0 0 0 11px #1b1c1f, 0 0 0 12px #3a3b3f, 0 40px 90px rgba(0,0,0,.35); isolation: isolate; }
.island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; z-index: 50; pointer-events: none; }
.screen { position: absolute; inset: 0; background: var(--bg); overflow: hidden; transition: transform 420ms cubic-bezier(.2,.9,.25,1), border-radius 420ms, filter 420ms; transform-origin: 50% 0; }
.screen.light2 { background: var(--bg2); }
.screen.pushed { transform: scale(0.93) translateY(12px); border-radius: 16px; filter: brightness(0.88); }
.home-ind { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--label); opacity: .85; z-index: 60; pointer-events: none; }
@media (max-width: 480px) {
  .stage { padding: 0; gap: 0; }
  .jump { order: 2; padding: 10px 12px 28px; }
  .phone { width: 100%; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
  .island, .home-ind { display: none; }
}

/* iOS bars */
.navbar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding-top: 50px; background: var(--bar); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-bottom: 0.5px solid transparent; transition: border-color 200ms; }
.navbar.scrolled { border-bottom-color: var(--sep); }
.navrow { min-height: 44px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; }
.navrow .ttl { font: 600 17px var(--bnf); opacity: 0; transition: opacity 180ms; }
.navbar.scrolled .navrow .ttl { opacity: 1; }
.navbtn { border: 0; background: none; color: var(--tint); min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font: 400 17px var(--bnf); cursor: pointer; padding: 0 8px; border-radius: 10px; }
.navbtn:active { opacity: .4; }
.navbtn.r { justify-self: end; }
.largettl { font: 700 34px/1.2 var(--bnf); margin: 4px 16px 10px; transition: opacity 160ms; }
.navbar.scrolled + .content .largettl { opacity: 0; }
.chathead { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; background: none; cursor: pointer; padding: 2px 8px 7px; border-radius: 12px; }
.chathead:active { opacity: .55; }
.chathead .today { color: var(--label2); font-weight: 400; }
.callbtn { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 0 34px; min-height: 52px; border-radius: 16px; background: var(--now-fill); color: #fff; font: 700 18px var(--bnf); }
.callbtn:active { transform: scale(.98); }
.callbtn svg { width: 22px; height: 22px; }
.demo-ex { pointer-events: none; margin: 4px 0 18px; }
.demo-ex .card { width: 100%; }
.sq.tinted { background: var(--tint-soft); color: var(--tint); }
.chathead small { display: inline-flex; align-items: center; gap: 2px; font: 500 12px var(--bnf); color: var(--label); }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 600 18px var(--bnf); color: var(--tint); background: var(--tint-soft); flex: none; font-weight: 700; }
.av.b, .av.c { background: var(--fill); color: var(--label); }
.av.sm { width: 34px; height: 34px; font-size: 15px; }
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; height: 83px; padding-bottom: 28px; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bar); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); border-top: 0.5px solid var(--sep); }
.tab { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: 500 12px var(--bnf); color: var(--label2); cursor: pointer; padding-top: 4px; }
.tab svg { width: 27px; height: 27px; }
.tab:active svg { transform: scale(.9); }
.tab[aria-current="page"] { color: var(--tint); }
.tab[aria-current="page"] svg { fill: var(--tint-soft); }
.content { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 98px 0 110px; }

/* Messages thread */
.thread, .content, .sheet .bd { scrollbar-width: none; }
.thread::-webkit-scrollbar, .content::-webkit-scrollbar, .sheet .bd::-webkit-scrollbar { display: none; }
.thread { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: 140px 14px 168px; background: var(--bg); }
.stamp { text-align: center; font: 500 13px var(--bnf); color: var(--label2); margin: 18px 0 8px; }
.stamp b { font-weight: 600; }
.msg { display: flex; flex-direction: column; margin: 2px 0; }
.msg.me { align-items: flex-end; }
.msg.them { align-items: flex-start; }
.b { max-width: 76%; padding: 8px 14px 9px; border-radius: 19px; font: 400 17px/1.45 var(--bnf); position: relative; overflow-wrap: anywhere; }
.them .b { background: var(--recv); color: var(--recv-ink); }
.me .b { background: var(--sent); color: var(--sent-ink); }
/* The Messages tail: a bubble-coloured curl, then a background-coloured mask that carves its inner curve. */
.msg.tail .b::before, .msg.tail .b::after { content: ""; position: absolute; bottom: 0; height: 17px; }
.msg.tail.them .b::before { left: -7px; width: 20px; background: var(--recv); border-bottom-right-radius: 16px 14px; }
.msg.tail.them .b::after { left: -26px; width: 26px; background: var(--bg); border-bottom-right-radius: 10px; }
.msg.tail.me .b::before { right: -7px; width: 20px; background: var(--sent); border-bottom-left-radius: 16px 14px; }
.msg.tail.me .b::after { right: -26px; width: 26px; background: var(--bg); border-bottom-left-radius: 10px; }
.receipt { font: 500 13px var(--bnf); color: var(--label2); margin: 3px 6px 4px; text-align: right; }
.msg.them + .receipt.l { text-align: left; }
.gap { height: 10px; }
.attach { padding: 0; overflow: hidden; background: none; border-radius: 18px; border: 0; cursor: pointer; display: block; box-shadow: 0 0 0 0.5px var(--sep); }
.attach .slip { width: 214px; height: 150px; }
.attach:active, .card:active { filter: brightness(0.93); }

/* Verdict card — the Messages rich-link grammar: preview on top, title and source below */
.card { width: min(300px, 82%); background: var(--recv); border-radius: 19px; overflow: hidden; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--recv-ink); display: block; transition: filter 120ms; }
.card .band { display: flex; align-items: center; gap: 7px; padding: 9px 13px; font: 600 15px/1.35 var(--bnf); }
.band.now { background: var(--now-fill); color: #fff; }
.band.week { background: var(--week-soft); color: var(--week); }
.card .pv { background: var(--paper); padding: 10px 12px; }
.card .meta { padding: 10px 14px 12px; }
.card .meta b { display: block; font: 700 21px/1.3 var(--bnf); }
.card .meta small { display: block; font: 400 13px/1.4 var(--bnf); color: var(--label2); margin-top: 2px; }
.card .rows { display: grid; gap: 6px; margin-top: 9px; padding-top: 9px; border-top: 0.5px solid var(--sep); }
.r { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 400 15px/1.35 var(--sys); }
.r .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font: 600 13px/1.6 var(--bnf); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; stroke-width: 2.4; }
.chip.in { background: var(--tint-soft); color: var(--tint-ink); }
.chip.out { background: var(--week-soft); color: var(--week); }
.chip.crit { background: var(--now-soft); color: var(--now-ink); }
.chip.unk { background: var(--unk-soft); color: var(--label2); }

.typing { display: inline-flex; gap: 4px; align-items: center; height: 38px; padding: 0 15px; background: var(--recv); border-radius: 19px; position: relative; }
.typing::before { content: ""; position: absolute; left: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--recv); }
.typing::after { content: ""; position: absolute; left: -6px; bottom: -7px; width: 6px; height: 6px; border-radius: 50%; background: var(--recv); }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--label3); animation: tp 1.3s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
@keyframes tp { 0%, 70%, 100% { opacity: .35; transform: scale(.88) } 35% { opacity: 1; transform: scale(1) } }
.in-me { animation: inMe 460ms cubic-bezier(.18,1.15,.3,1) both; transform-origin: 100% 100%; }
.in-them { animation: inThem 380ms cubic-bezier(.2,1.1,.3,1) both; transform-origin: 0 100%; }
@keyframes inMe { from { transform: translate(-8px, 64px) scale(.7); opacity: 0 } 40% { opacity: 1 } to { transform: none; opacity: 1 } }
@keyframes inThem { from { transform: scale(.82); opacity: 0 } to { transform: none; opacity: 1 } }
.suggest { display: flex; gap: 8px; overflow-x: auto; padding: 8px 2px 2px; margin: 0 -2px; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.suggest button { flex: none; border: 1px solid var(--sep); background: var(--bg); color: var(--tint); border-radius: 18px; padding: 6px 14px; font: 500 15px var(--bnf); cursor: pointer; }
.suggest button:active { background: var(--tint-soft); }

/* Composer — the Messages input bar, sitting on the tab bar */
.composer { position: absolute; left: 0; right: 0; bottom: 83px; z-index: 10; padding: 8px 10px; display: flex; align-items: flex-end; gap: 8px; background: var(--bar); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
.camb { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--tint); color: var(--on-tint); display: grid; place-items: center; cursor: pointer; flex: none; transition: transform 120ms; }
.camb:active { transform: scale(.9); }
.camb svg { width: 25px; height: 25px; }
.field { flex: 1; min-height: 36px; border-radius: 18px; border: 1px solid var(--sep); display: flex; align-items: center; padding: 2px 3px 2px 14px; background: var(--bg); }
.field input { flex: 1; border: 0; background: none; outline: 0; font: 400 17px var(--bnf); min-width: 0; padding: 4px 0; }
.field input::placeholder { color: var(--label2); }
.send { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--sent); color: #fff; place-items: center; cursor: pointer; flex: none; display: none; }
.send.on { display: grid; animation: popin 260ms cubic-bezier(.3,1.5,.5,1) both; }
.send svg { width: 18px; height: 18px; stroke-width: 2.6; }

/* Long-press menu over a blurred thread */
.ctx { position: absolute; inset: 0; z-index: 40; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); background: rgba(0,0,0,.16); display: flex; flex-direction: column; justify-content: center; padding: 0 14px; gap: 10px; animation: fade 180ms ease both; }
.ctx .msg { animation: lift 260ms cubic-bezier(.2,1.2,.3,1) both; }
.ctx .menu { width: 250px; background: var(--bar); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-radius: 14px; overflow: hidden; animation: pop 280ms cubic-bezier(.2,1.2,.3,1) both; transform-origin: 20px 0; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
.ctx .menu.r { align-self: flex-end; transform-origin: 230px 0; }
.ctx .menu button { width: 100%; border: 0; background: none; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font: 400 17px var(--bnf); border-top: 0.5px solid var(--sep); cursor: pointer; text-align: left; }
.ctx .menu button:first-child { border-top: 0; }
.ctx .menu button:active { background: var(--fill); }
.ctx .menu svg { width: 20px; height: 20px; }
@keyframes fade { from { opacity: 0 } }
@keyframes pop { from { transform: scale(.35); opacity: 0 } }
@keyframes lift { to { transform: scale(1.03) } }

/* Grouped lists */
.sect { margin: 24px 16px 0; }
.sect h3, .sect h2.sh { font: 400 13px var(--bnf); color: var(--label2); margin: 0 16px 6px; }
.sect .foot { font: 400 13px/1.5 var(--bnf); color: var(--label2); margin: 6px 16px 0; }
.group { background: var(--bg3); border-radius: 12px; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 16px; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; position: relative; font: 400 17px/1.35 var(--bnf); color: var(--label); }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.cell.ic + .cell.ic::before { left: 62px; }
button.cell:active { background: var(--fill); }
.cell .grow { flex: 1; min-width: 0; }
.cell small { display: block; font-size: 14px; color: var(--label2); line-height: 1.4; }
.cell .val { color: var(--label2); font-size: 16px; font-family: var(--sys); }
.cell .chev { color: var(--label3); width: 18px; height: 18px; }
.cell .tickmark { color: var(--tint); width: 20px; height: 20px; stroke-width: 2.4; }
.sq { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: #fff; flex: none; }
.sq svg { width: 19px; height: 19px; stroke-width: 2; }
.soon { font: 500 12px var(--bnf); color: var(--label2); background: var(--fill); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
.sw { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); border: 0; position: relative; cursor: pointer; flex: none; transition: background 250ms; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.16); transition: transform 320ms cubic-bezier(.3,1.3,.5,1); }
.sw[aria-checked="true"] { background: var(--tint); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; margin: 0 16px; }
.seg button { border: 0; background: none; border-radius: 7px; min-height: 32px; font: 500 14px var(--bnf); cursor: pointer; transition: background 200ms, box-shadow 200ms; }
.seg button[aria-pressed="true"] { background: var(--bg3); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 0.5px rgba(0,0,0,.04); font-weight: 600; }
.search { margin: 0 16px; display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 10px; height: 36px; padding: 0 8px; color: var(--label2); font: 400 17px var(--bnf); border: 0; width: calc(100% - 32px); cursor: text; text-align: left; }
.search svg { width: 18px; height: 18px; }

/* Calendar */
.calhd { display: flex; align-items: center; justify-content: space-between; margin: 22px 8px 4px 16px; }
.calhd b { font: 700 22px var(--bnf); }
.calhd span { display: flex; }
.cal { margin: 0 8px; }
.wk, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
.wk span { font: 500 12px var(--bnf); color: var(--label2); padding: 6px 0; }
.wk span.fri, .d.fri { color: var(--label2); }
.d { border: 0; background: none; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font: 400 20px var(--bnf); font-variant-numeric: tabular-nums; color: var(--label); }
.d.blank { visibility: hidden; }
.d .n { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; transition: background 160ms; }
.d.today .n { background: var(--label); color: var(--bg); font-weight: 700; }
.d.sel:not(.today) .n { background: var(--tint-soft); color: var(--tint); font-weight: 700; box-shadow: inset 0 0 0 2px var(--tint); }
.d .dots { display: flex; gap: 3px; height: 5px; }
.d .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--label3); }
.d .dots { height: 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 16px 0; font: 500 13px var(--bnf); color: var(--label2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legend i.ok { background: var(--tint); } .legend i.week { background: var(--week); } .legend i.now { background: var(--now-fill); }
.legend i.ring { background: none; box-shadow: inset 0 0 0 2px var(--tint); width: 12px; height: 12px; }
.d .dots i.week { background: var(--week); } .d .dots i.now { background: var(--now-fill); } .d .dots i.ok { background: var(--tint); }
.d.ring .n { box-shadow: 0 0 0 2px var(--tint); }

        <div class="suggest"><button data-quick="how">কীভাবে কাজ করে?</button><button data-quick="safe">আমার কাগজ কে দেখবে?</button></div>` + st.extra.join("");

    let h = `<div class="stamp"><b>বুধ, ১৪ অক্টোবর</b> সকাল ৯:১২</div>` + me(photo(P.creat), false) + me(txt(`${pname()}র কিডনির রিপোর্ট`)) + `<div class="gap"></div>` + them(verdictCard(P.creat), false);
    h += `<div class="stamp"><b>বৃহস্পতি, ১৫ অক্টোবর</b> বিকেল ৫:৪০</div>` + me(photo(P.rx)) + `<div class="gap"></div>` + them(verdictCard(P.rx), false) + them(txt(P.rx.say));
    if (st.scene === "now") {
      h += `<div class="stamp"><b>আজ</b> সকাল ১০:০৫</div>` + me(photo(P.potas)) + `<div class="receipt">পড়া হয়েছে ১০:০৫</div>` + them(verdictCard(P.potas), false)
        + them(txt("এখনই কাছের হাসপাতালের জরুরি বিভাগে নিয়ে যান, বা ৯৯৯-এ ফোন করুন। কাগজের ছবিটা সাথে রাখুন।"))
        + `<a class="callbtn" href="tel:999">${I.phone}৯৯৯-এ ফোন করুন</a><div class="suggest"><button data-quick="share">নাজমাকে (বোন) জানাই</button><button data-open="potas">কাগজটা দেখাও</button></div>`;
    } else if (st.scene === "retake") {
      h += `<div class="stamp"><b>আজ</b> দুপুর ১২:২০</div>` + me(photo(P.blur)) + `<div class="receipt">পড়া হয়েছে ১২:২০</div>`
        + them(txt("ছবিটা ঝাপসা এসেছে, তাই আন্দাজে কিছু বলব না।"), false)
        + them(txt("আরেকবার তুলবেন? দিনের আলোয়, কাগজটা সমান করে, ফোন ঠিক উপর থেকে। এই ছবিটা মাসের হিসাবে গোনা হবে না।"))
        + `<div class="suggest"><button data-action="camera">আবার তুলি</button><button data-quick="tips">ভালো ছবির উপায়</button></div>`;
    } else {
      h += `<div class="stamp"><b>আজ</b> সকাল ৮:৩০</div>` + me(photo(P.cbc)) + `<div class="receipt">পড়া হয়েছে ৮:৩১</div>` + them(verdictCard(P.cbc), false) + them(txt(P.cbc.say))
        + `<div class="suggest"><button data-quick="compare">আগেরটার সাথে মেলাও</button><button data-quick="doctor">ডাক্তারকে কী জিজ্ঞেস করব?</button></div>`;
    }
    return h + st.extra.join("");
  }

  const tabs = () => {
    const t = (id, l, k) => `<button class="tab" data-tab="${id}" ${st.tab === id ? 'aria-current="page"' : ""}>${I[k]}${l}</button>`;
    return `<nav class="tabbar" aria-label="প্রধান">${t("chat", "চ্যাট", "chat")}${t("papers", "কাগজপত্র", "cal")}${t("health", "স্বাস্থ্য", "heart")}${t("family", "পরিবার", "fam")}</nav>`;
  };
  function chatScreen() {
    const p = PATIENTS[st.patient];
    return `<div class="screen" id="scr"><h1 class="sr-only">Medioo — ${pname()}র কাগজ নিয়ে কথা</h1><div class="thread" id="thread" role="log" aria-label="Medioo-র সাথে কথোপকথন">${threadHTML()}</div>
      <div class="navbar scrolled" id="nav"><div class="navrow"><span></span><button class="chathead" data-action="switch" aria-label="${p.name}র কাগজ দেখছেন, রোগী বদলাতে চাপুন"><span class="av ${p.cls}">${p.init}</span><small>${p.name} ${ic("down")}</small><small class="today">২০ অক্টোবর, মঙ্গলবার</small></button><span></span></div></div>
      <div class="composer"><button class="camb" data-action="camera" aria-label="কাগজের ছবি তুলুন">${I.cam}</button>
        <div class="field"><input id="msgIn" placeholder="Medioo-কে লিখুন" aria-label="বার্তা" autocomplete="off" enterkeyhint="send"><button class="mic" data-mic="1" aria-label="ধরে রেখে বলুন">${I.mic}</button><button class="send" id="sendBtn" data-action="sendtext" aria-label="পাঠান">${I.arrowup}</button></div></div>${tabs()}</div>`;
  }
  function largeScreen(title, inner) {
    return `<div class="screen light2" id="scr"><div class="navbar" id="nav"><div class="navrow"><span></span><span class="ttl">${title}</span><span></span></div></div>
      <div class="content" id="content"><h1 class="largettl">${title}</h1>${inner}</div>${tabs()}</div>`;
  }
  function paperCell(k) {
    const p = P[k];
    const c = p.urgency === "now" ? `<span class="chip crit">${I.octa}এখনই</span>` : p.urgency === "week" ? `<span class="chip out">${I.calw}এ সপ্তাহে</span>` : p.urgency === "retake" ? `<span class="chip unk">${I.cam}আবার তুলতে হবে</span>` : p.urgency === "unk" ? chip("unk") : "";
    return `<button class="cell" data-open="${k}"><span class="thumb">${slip(p)}</span><span class="grow">${p.title}<small>${bn(p.day)} অক্টোবর · ${p.sub}</small>${c ? `<span style="display:block;margin-top:4px">${c}</span>` : ""}</span>${chev()}</button>`;
  }
  function papersScreen() {
    const first = new Date(2026, 9, 1).getDay(), off = (first + 1) % 7;
    const marks = { 13: "", 14: "week", 15: "", 16: "now", 20: "ok" };
    let cells = ""; for (let i = 0; i < off; i++) cells += `<span class="d blank"></span>`;
    for (let d = 1; d <= 31; d++) { const wd = (off + d - 1) % 7;
      const c = ["d", wd === 6 ? "fri" : "", d === 20 ? "today" : "", d === st.calDay ? "sel" : "", d === 22 ? "ring" : ""].join(" ");
      cells += `<button class="${c}" data-day="${d}" aria-label="${bn(d)} অক্টোবর${d === 22 ? ", ডাক্তারের কাছে যাওয়ার দিন" : ""}" ${d === st.calDay ? 'aria-pressed="true"' : ""}><span class="n">${bn(d)}</span><span class="dots">${d in marks ? `<i class="${marks[d]}"></i>` : ""}</span></button>`; }
    const byDay = { 13: ["lipid"], 14: ["creat"], 15: ["rx"], 16: ["potas"], 20: ["cbc", "blur"] };
    const dayList = (byDay[st.calDay] || []).map(paperCell).join("") || `<div class="cell" style="color:var(--label2)">${st.calDay === 22 ? "ডাক্তারের কাছে আবার যাওয়ার দিন · ১৫ অক্টোবরের প্রেসক্রিপশন" : "এই দিনে কোনো কাগজ নেই"}</div>`;
    return largeScreen("কাগজপত্র", `
      <div class="seg" role="group" aria-label="দেখার ধরন" style="margin-bottom:16px"><button aria-pressed="true">মাস</button><button aria-pressed="false">তালিকা</button></div>
      <button class="duecard" data-open="rx"><span class="big"><small>অক্টোবর</small><span>${bn(22)}</span></span><span><b>ডাক্তারের কাছে আবার যাওয়ার দিন</b><em>১৫ অক্টোবরের প্রেসক্রিপশনে লেখা · আর ২ দিন</em></span></button>
      <div class="calhd"><b>অক্টোবর ২০২৬</b><span><button class="navbtn" data-action="soon" aria-label="আগের মাস">${I.left}</button><button class="navbtn" data-action="soon" aria-label="পরের মাস">${I.right}</button></span></div>
      <div class="cal"><div class="wk"><span>শনি</span><span>রবি</span><span>সোম</span><span>মঙ্গল</span><span>বুধ</span><span>বৃহঃ</span><span class="fri">শুক্র</span></div><div class="days">${cells}</div></div>
      <div class="legend" aria-hidden="true"><span><i class="ok"></i>সীমার মধ্যে</span><span><i class="week"></i>এ সপ্তাহে</span><span><i class="now"></i>এখনই</span><span><i class="ring"></i>ডাক্তারের কাছে যাওয়া</span></div>
      <div class="sect" style="margin-top:12px"><h2 class="sh">${bn(st.calDay)} অক্টোবর</h2><div class="group">${dayList}</div></div>
      <div class="sect"><h2 class="sh">অক্টোবরের সব কাগজ</h2><div class="group">${["cbc", "potas", "rx", "creat", "lipid"].map(paperCell).join("")}</div></div>`);
  }
  function healthRow(k, color, label, sub, action) {
    return `<button class="cell ic" data-action="${action || "soon"}"><span class="sq tinted">${I[k]}</span><span class="grow">${label}${sub ? `<small>${sub}</small>` : ""}</span>${action ? chev() : `<span class="soon">শিগগিরই</span>`}</button>`;
  }
  function healthScreen() {
    return largeScreen("স্বাস্থ্য", `
      <button class="search" data-action="soon">${I.search}<span>খুঁজুন, যেমন HbA1c</span></button>
      <div class="sect"><h2 class="sh">${pname()}র স্বাস্থ্যের খাতা</h2><div class="group">
        ${healthRow("flask", "#e0352b", "ল্যাবের মান", "HbA1c, Creatinine, Potassium · সময়ের সাথে", "labs")}
        ${healthRow("pill", "#0a84ff", "ওষুধ", "২টি · প্রেসক্রিপশনে যেমন লেখা", "meds")}
        ${healthRow("doc", "#8e8e93", "সব কাগজ", "৬টি · তারিখ ধরে", "papers")}</div></div>
      <div class="sect"><div class="group"><button class="cell ic" data-action="comingsoon"><span class="sq tinted">${I.calw}</span><span class="grow">আরও আসছে<small>ডাক্তারের জন্য সারাংশ, জরুরি কার্ড, টিকা, ডিভাইস</small></span>${chev()}</button></div></div>
      <p class="note" style="margin:18px 32px 0">Medioo ডাক্তার নয়। কাগজে যা লেখা আছে সেটাই গুছিয়ে দেখায় আর সহজ করে বলে।</p>`);
  }
  function familyScreen() {
    const per = (q) => `<button class="cell ic" data-person="${q.id}"><span class="av sm ${q.cls}">${q.init}</span><span class="grow">${q.name}<small>${q.full} · ${bn(q.age)} বছর</small></span>${st.patient === q.id ? tickmark() : ""}</button>`;
    const conds = ["ডায়াবেটিস", "উচ্চ রক্তচাপ", "কিডনির রোগ", "থাইরয়েড"].map((c) => `<button class="cell" data-cond="${c}" aria-pressed="${st.conds.includes(c)}"><span class="grow">${c}</span>${st.conds.includes(c) ? tickmark() : ""}</button>`).join("");
    return largeScreen("পরিবার", `
      <div class="sect" style="margin-top:6px"><h2 class="sh">যাঁদের কাগজ রাখছেন</h2><div class="group">${per(PATIENTS.amma)}${per(PATIENTS.abbu)}<button class="cell ic" data-action="addperson"><span class="sq" style="background:var(--fill);color:var(--tint)">${I.plus}</span><span class="grow" style="color:var(--tint)">কাউকে যোগ করুন</span></button></div></div>
      <div class="sect"><h2 class="sh">${pname()}র দীর্ঘমেয়াদি অসুখ</h2><div class="group">${conds}</div><p class="foot">ডাক্তার যা বলেছেন শুধু সেটাই বাছুন। Medioo এগুলো দেখে কোন রিপোর্ট কবে আসার কথা মনে করায়।</p></div>
      <div class="sect"><div class="group"><div class="cell"><span class="grow">মনে করিয়ে দেওয়া<small>ফলো-আপ, নতুন পরীক্ষার সময়</small></span><button class="sw" role="switch" aria-checked="${st.reminders}" data-action="rem" aria-label="মনে করিয়ে দেওয়া"></button></div></div></div>
      <div class="sect"><h2 class="sh">একসাথে দেখছেন</h2><div class="group"><div class="cell ic"><span class="av sm c">ন</span><span class="grow">নাজমা (বোন)<small>দেখতে আর কাগজ পাঠাতে পারেন</small></span></div><button class="cell ic" data-action="invite"><span class="sq" style="background:var(--fill);color:var(--tint)">${I.share}</span><span class="grow" style="color:var(--tint)">ভাই বা বোনকে আমন্ত্রণ</span></button></div></div>
      <div class="sect"><h2 class="sh">অ্যাকাউন্ট</h2><div class="group"><div class="cell"><span class="grow">WhatsApp নম্বর</span><span class="val">+880 17•• ••••71</span></div><button class="cell" data-action="lang"><span class="grow">ভাষা</span><span class="val">বাংলা</span>${chev()}</button><button class="cell" data-action="signout"><span class="grow" style="color:var(--now)">বের হন</span></button></div></div>`);
  }

  // Sign-in: an Apple-style welcome (app icon, three promises, one button), then number, then a code that arrives in WhatsApp.
  const digits = (s) => s.replace(/[০-৯]/g, (d) => BN.indexOf(d)).replace(/\D/g, "");
  const local = (s) => digits(s).replace(/^880/, "").replace(/^0/, "");
  const valid = (s) => /^1[3-9]\d{8}$/.test(local(s));
  const fmt = (s) => { const d = local(s); return d.length > 4 ? d.slice(0, 4) + "-" + d.slice(4, 10) : d; };
  function onboardingScreen() {
    if (st.authStep === "welcome") {
      const f = (k, b, s) => `<div class="feat"><span class="fi">${I[k]}</span><div><b>${b}</b><span>${s}</span></div></div>`;
      return `<div class="onb"><div class="welcome-top"><img class="mio-wave" src="mio.webp" alt="Mio — Medioo-র সঙ্গী" width="118" height="146"><span class="wordmark" role="img" aria-label="medioo" style="width:132px;height:47px"></span></div>
        <h1 style="margin:18px 0 24px">আম্মা-আব্বার সব কাগজ, এক জায়গায়</h1>
        <div class="demo-ex" inert>${me(txt("আম্মার কিডনির রিপোর্ট"))}<div class="gap"></div>${them(verdictCard(P.creat))}</div>
        <div class="push"></div>
        <button class="btn fill" data-action="start">শুরু করুন</button>
        <p class="fine">${I.lock} Medioo ডাক্তার নয় — কাগজে যা লেখা, সেটাই সহজ করে বলে।</p></div>`;
    }
    if (st.authStep === "number") {
      return `<div class="onb step"><button class="navbtn back" data-action="toWelcome" aria-label="ফিরে যান">${ic("back")}</button>
        <h2 class="form-ttl">আপনার WhatsApp নম্বর</h2><p class="form-sub">এই নম্বরের WhatsApp-এ একটা ৬ সংখ্যার কোড পাঠাব। কোনো পাসওয়ার্ড লাগবে না।</p>
        <div class="inset"><button class="country" data-action="country"><span style="color:var(--label);font-family:var(--bnf)">দেশ</span><span>বাংলাদেশ +880 ${chev()}</span></button>
        <label class="numfield"><b>+880</b><input id="num" inputmode="tel" autocomplete="tel-national" placeholder="1712-345678" value="${fmt(st.number)}" aria-label="ফোন নম্বর" aria-describedby="err"></label></div>
        <p class="err" id="err" aria-live="polite"></p>
        <div class="push"></div>
        <button class="btn fill" id="contBtn" data-action="toCode" aria-disabled="${!valid(st.number)}">কোড পাঠান</button>
        <p class="fine">যে নম্বরে WhatsApp চালান, সেটাই দিন।</p></div>`;
    }
    return `<div class="onb step"><button class="navbtn back" data-action="toNumber" aria-label="নম্বর বদলান">${ic("back")}</button>
      <h2 class="form-ttl">কোডটা লিখুন</h2><p class="form-sub" style="margin-bottom:18px">+880 ${fmt(st.number) || "1712-345678"} · <button class="resend" style="padding:0;font-size:16px" data-action="toNumber">নম্বর বদলান</button></p>
      <div class="sentcard"><span class="wa">${I.wa}</span><span><b>WhatsApp-এ কোড পাঠিয়েছি</b><small>Medioo-র চ্যাটে এসেছে, এক মিনিটের মধ্যে</small></span></div>
      <div class="otp" id="otp" role="group" aria-label="৬ সংখ্যার কোড">${[0, 1, 2, 3, 4, 5].map((i) => `<input inputmode="numeric" autocomplete="${i === 0 ? "one-time-code" : "off"}" aria-label="কোডের ${bn(i + 1)} নম্বর ঘর" data-otp="${i}">`).join("")}</div>
      <p class="err" id="otperr" aria-live="polite"></p>
      <button class="resend" id="resend" disabled data-action="resend">আবার পাঠান ০:৩০</button>
      <div class="push"></div>
      <p class="fine">প্রোটোটাইপ: যেকোনো ৬ সংখ্যা দিন · ০০০০০০ দিলে ভুল কোড দেখাবে<br>Medioo কখনো ফোন করে কোড চায় না।</p></div>`;
  }

  function render() {
    let html;
    if (st.scene === "welcome") html = onboardingScreen();
    else html = st.tab === "papers" ? papersScreen() : st.tab === "health" ? healthScreen() : st.tab === "family" ? familyScreen() : chatScreen();
    root.innerHTML = html + `<div class="toast" id="toast" role="status"></div>`;
    if (st.scene === "welcome") return bindAuth();
    if (st.tab === "chat") {
      const t = document.getElementById("thread"); t.scrollTop = t.scrollHeight;
      const inp = document.getElementById("msgIn"), sb = document.getElementById("sendBtn");
      inp.addEventListener("input", () => sb.classList.toggle("on", inp.value.trim().length > 0));
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && inp.value.trim()) { e.preventDefault(); sendText(inp.value.trim()); } });
      bindLongPress(t);
    } else {
      const c = document.getElementById("content"), nav = document.getElementById("nav");
      c.addEventListener("scroll", () => nav.classList.toggle("scrolled", c.scrollTop > 34), { passive: true });

  }
  function speak(text) { try { const v = speechSynthesis.getVoices().find((x) => /^bn/i.test(x.lang)); if (!v || !st.speak) return; const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }

  const VOICE_HINT_LISTEN = "বলুন — আঙুল তুললে করে দেব";
  const papersOf = (id) => id === "amma" ? [P.creat].concat(st.scene === "now" ? [P.potas] : []) : [];
  function openSoundPicker() {
    openSheet("শব্দ", `<p class="note" style="margin-top:0">পাঠানো আর উত্তর আসার শব্দ বেছে নিন — চাপলে শুনতে পাবেন।</p>
      <div style="margin:0 16px"><div class="sgrp"><div class="srow"><span class="grow">শব্দ চালু<small>সব শব্দ একসাথে বন্ধ করা যায়</small></span><button class="sw" role="switch" aria-checked="${st.sound}" data-snds="sndall" aria-label="শব্দ চালু"></button></div>
      <div class="srow" style="border-top:0.5px solid var(--sep)"><span class="grow">উত্তর জোরে পড়ে শোনানো<small>ফোনে বাংলা কণ্ঠ থাকলে</small></span><button class="sw" role="switch" aria-checked="${st.speak}" data-snds="speakall" aria-label="উত্তর পড়ে শোনানো"></button></div></div>
      <div id="sndlist">${soundPickerHTML()}</div></div>`);
  }
  function execCommand(c) {
    if (c.patient) st.patient = c.patient;
    const askChat = (answer) => { closeSheet(true); st.tab = "chat"; if (!["chat", "first", "now", "retake"].includes(st.scene)) st.scene = "chat"; render(); setTimeout(() => { sendMine(txt(c.text.replace(/</g, "&lt;"))); setTimeout(() => { const a = answer(); reply(a); setTimeout(() => speak(a), 1200); }, 500); }, 120); };
    const go = (tab) => { closeSheet(true); st.tab = tab; render(); };
    const paperFor = { "Serum Creatinine": "creat", "Serum Potassium": st.scene === "now" ? "potas" : "creat", "Haemoglobin": "cbc", "LDL Cholesterol": "lipid" };
    switch (c.do) {
      case "share": render(); toast("নাজমাকে পাঠানো হয়েছে"); break;
      case "urgent": askChat(urgentSummary); break;
      case "upload": go("chat"); openSheet("কাগজ পাঠান", cameraSheet(), "medium"); break;
      case "lab": go("health"); if (c.marker === "HbA1c") openSheet("HbA1c", trendSheet()); else { const k = paperFor[c.marker]; openSheet(P[k].title, paperSheet(k)); } break;
      case "ask": askChat(() => ANSWERS.find(([re]) => re.test(c.text))[1]()); break;
      case "calendar": go("papers"); break;
      case "meds": go("health"); openSheet("ওষুধ", medsSheet()); break;
      case "labs": go("health"); openSheet("ল্যাবের মান", labsSheet()); break;
      case "latest": go("chat"); openSheet(P.cbc.title, paperSheet("cbc")); break;
      case "settings": go("family"); break;
      case "switch": render(); toast(`${PATIENTS[st.patient].name}র কাগজ দেখাচ্ছি`); break;
    }
  }
  // The mic in the composer works like Messages' dictation: hold to talk, lift to run; a quick tap opens the panel for typing.
  let micAt = 0;
  root.addEventListener("pointerdown", (e) => { if (!e.target.closest("[data-mic]")) return; e.preventDefault(); try { e.target.closest("[data-mic]").setPointerCapture(e.pointerId); } catch (x) {} micAt = performance.now(); if (navigator.vibrate) navigator.vibrate(8); voiceStart(); });
  root.addEventListener("pointerup", (e) => { if (!e.target.closest("[data-mic]") || !vstate) return;
    if (performance.now() - micAt < 300 && !vstate.typed) { vstate.typed = true; try { rec && rec.abort(); } catch (x) {} voiceOverlay("type"); return; } voiceStop(); });
  root.addEventListener("click", (e) => {
    const sn = e.target.closest("[data-snd]");
    if (sn) { e.stopPropagation(); const [k, id] = sn.dataset.snd.split(":"); SND[k] = id; saveSnd(); const was = st.sound; st.sound = true; play(id); st.sound = was; document.getElementById("sndlist").innerHTML = soundPickerHTML(); return; }
    const sw = e.target.closest("[data-snds]");
    if (sw) { e.stopPropagation(); if (sw.dataset.snds === "sndall") st.sound = !st.sound; else st.speak = !st.speak; sw.setAttribute("aria-checked", String(sw.dataset.snds === "sndall" ? st.sound : st.speak)); if (st.sound) tick(); return; }
    const vc = e.target.closest("[data-vcmd]"); if (vc) { e.stopPropagation(); runCommand(vc.dataset.vcmd); return; }
    if (e.target.closest("[data-vgo]")) { e.stopPropagation(); const i = document.getElementById("vinput"); if (i && i.value.trim()) runCommand(i.value); return; }
    if (e.target.closest("[data-mic]")) { e.stopPropagation(); return; }
    if (vstate && !e.target.closest(".voice")) voiceClose();
  }, true);

  render();
})();
</script>
