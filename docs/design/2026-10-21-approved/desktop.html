<title>Medioo Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Caveat:wght@500;600&family=Galada&display=swap">
<style>
/* Layout: the desktop web app — sidebar (family, this patient's sections, what's coming), then the paper large in the middle and the conversation beside it. */
:root {
  --bg: #ffffff;
  --bg2: #f5f5f7;
  --bg3: #ffffff;
  --side: #f3f4f6;
  --canvas: #e8e9ed;
  --label: #1d1d1f;
  --label2: rgba(60, 60, 67, 0.82);
  --label3: rgba(60, 60, 67, 0.38);
  --sep: rgba(60, 60, 67, 0.16);
  --fill: rgba(120, 120, 128, 0.12);
  --hover: rgba(120, 120, 128, 0.1);
  --recv: #e9e9eb;
  --recv-ink: #000000;
  --sent: #06788a;
  --tint: #06788a;
  --tint-soft: rgba(6, 120, 138, 0.12);
  --selbg: rgba(6, 120, 138, 0.13);
  --mio-bg: #dff0f2;
  --wordmark: url("medioo-light.svg");
  --on-tint: #ffffff; --tint-ink: #045f6d; --now-ink: #a3201a;
  --green: #34c759;
  --now: #d93229; --now-fill: #d93229;
  --now-soft: rgba(217, 50, 41, 0.11);
  --week: #92400e;
  --week-soft: rgba(255, 149, 0, 0.16);
  --unk-soft: rgba(120, 120, 128, 0.14);
  --paper: #fffefa;
  --bar: rgba(250, 250, 252, 0.86);
  --scrim: rgba(0, 0, 0, 0.28);
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 10px 30px rgba(0,0,0,.12);
  --bnf: "Noto Sans Bengali", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
  --sw: 256px; --cw: 400px;
  color-scheme: light;
}
@media (max-width: 1199px) { :root { --sw: 0px; --cw: 360px; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1c1e; --bg2: #141416; --bg3: #2a2a2d; --side: #232326; --canvas: #101012; --label: #f5f5f7; --label2: rgba(235,235,245,.78); --label3: rgba(235,235,245,.32);
  --sep: rgba(84,84,88,.62); --fill: rgba(120,120,128,.24); --hover: rgba(120,120,128,.18); --recv: #2c2c2f; --recv-ink: #fff; --sent: #06788a;
  --tint: #5cc8d6; --tint-soft: rgba(92,200,214,.16); --selbg: rgba(92,200,214,.18); --mio-bg: #1d3b41; --wordmark: url("medioo-dark.svg"); --on-tint: #062a30; --tint-ink: var(--tint); --now-ink: var(--now); --green: #30d158; --now: #ff8a80; --now-fill: #d93229; --now-soft: rgba(255,90,79,.18);
  --week: #ffb340; --week-soft: rgba(255,159,10,.2); --unk-soft: rgba(120,120,128,.26); --paper: #f4f0e6; --bar: rgba(36,36,38,.86); --scrim: rgba(0,0,0,.5);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1c1c1e; --bg2: #141416; --bg3: #2a2a2d; --side: #232326; --canvas: #101012; --label: #f5f5f7; --label2: rgba(235,235,245,.78); --label3: rgba(235,235,245,.32);
  --sep: rgba(84,84,88,.62); --fill: rgba(120,120,128,.24); --hover: rgba(120,120,128,.18); --recv: #2c2c2f; --recv-ink: #fff; --sent: #06788a;
  --tint: #5cc8d6; --tint-soft: rgba(92,200,214,.16); --selbg: rgba(92,200,214,.18); --mio-bg: #1d3b41; --wordmark: url("medioo-dark.svg"); --on-tint: #062a30; --tint-ink: var(--tint); --now-ink: var(--now); --green: #30d158; --now: #ff8a80; --now-fill: #d93229; --now-soft: rgba(255,90,79,.18);
  --week: #ffb340; --week-soft: rgba(255,159,10,.2); --unk-soft: rgba(120,120,128,.26); --paper: #f4f0e6; --bar: rgba(36,36,38,.86); --scrim: rgba(0,0,0,.5);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.5); color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--label); font: 15px/1.5 var(--bnf); -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: var(--tint-soft); }
button, input { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--tint) 60%, transparent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
* { scrollbar-width: thin; scrollbar-color: var(--label3) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--label3); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
.num { font-family: var(--sys); font-variant-numeric: tabular-nums; }

/* Shell */
.app { display: grid; grid-template-columns: var(--sw) minmax(0, 1fr); height: 100vh; height: 100dvh; }
.side { background: var(--side); border-right: 0.5px solid var(--sep); display: flex; flex-direction: column; min-height: 0; z-index: 20; }
.brand { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; }
.brand .mk { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(160deg, #3cc493, #0a7a62 70%); display: grid; place-items: center; flex: none; }
.brand .mk svg { width: 17px; height: 17px; stroke: #fff; stroke-width: 2.2; }
.brand b { font: 700 17px var(--sys); letter-spacing: -0.01em; }
.brand .sp { flex: 1; }
.search { margin: 0 12px 4px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 8px; background: var(--fill); color: var(--label2); position: relative; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: 0; font: 400 14px var(--bnf); color: var(--label); }
.search input::placeholder { color: var(--label2); }
.search kbd { font: 500 11px var(--sys); color: var(--label2); border: 0.5px solid var(--label2); border-radius: 4px; padding: 0 4px; }
.search svg { width: 16px; height: 16px; }
.snav { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.sgh { font: 600 13px var(--bnf); color: var(--label2); padding: 16px 8px 4px; display: flex; justify-content: space-between; align-items: center; }
.si { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 8px; border-radius: 8px; width: 100%; border: 0; background: none; font: 400 15px var(--bnf); cursor: pointer; text-align: left; color: var(--label); position: relative; }
.si:hover { background: var(--hover); }
.si:active { background: var(--fill); }
.si[aria-current="page"] { background: var(--selbg); }
.si[aria-current="page"] .lbl { font-weight: 600; }
.si > svg { color: var(--tint); }
.si .cnt { margin-left: auto; font: 500 13px var(--sys); color: var(--label2); }
.si .soon { margin-left: auto; font: 500 11px var(--bnf); color: var(--label2); background: var(--fill); padding: 0 6px; border-radius: 5px; }
.si.dim > svg { color: var(--label2); }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--bnf); color: var(--tint); background: var(--tint-soft); flex: none; position: relative; font-weight: 700; }
.av.b { background: var(--fill); color: var(--label); }
.av.n { background: var(--fill); color: var(--label2); }
.av.lg { width: 40px; height: 40px; font-size: 16px; }
.av .st { position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--side); }
.st.now { background: var(--now-fill); } .st.week { background: #f29100; }
.nextup { margin: 8px 12px; border-radius: 12px; background: var(--bg3); padding: 10px 12px; display: flex; gap: 12px; align-items: center; border: 0; width: calc(100% - 24px); text-align: left; cursor: pointer; box-shadow: 0 0 0 0.5px var(--sep); }
.nextup:hover { box-shadow: 0 0 0 0.5px var(--sep), 0 4px 14px rgba(0,0,0,.08); }
.calchip { width: 44px; border-radius: 8px; overflow: hidden; text-align: center; flex: none; box-shadow: 0 0 0 0.5px var(--sep); background: var(--bg3); }
.calchip small { display: block; background: var(--tint); color: var(--on-tint); font: 600 10px/1.8 var(--bnf); }
.calchip span { display: block; font: 600 20px/1.5 var(--bnf); }
.nextup b { display: block; font: 600 14px/1.4 var(--bnf); } .nextup em { font: 400 12px/1.4 var(--bnf); color: var(--label2); font-style: normal; }
.me-row { border-top: 0.5px solid var(--sep); padding: 8px 10px; flex: none; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
.ban { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 18px; font: 600 15px/1.4 var(--bnf); flex: none; animation: drop 420ms cubic-bezier(.2,1,.3,1) both; }
.ban.now { background: var(--now-fill); color: #fff; }
.ban.week { background: var(--week-soft); color: var(--week); }
.ban .sp { flex: 1; }
.ban small { font-weight: 400; margin-left: 4px; }
.ban button, .ban a { border: 0; border-radius: 8px; padding: 5px 12px; font: 600 14px var(--bnf); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.ban.now button, .ban.now a { background: rgba(0,0,0,.22); color: #fff; } .ban.now button:hover, .ban.now a:hover { background: rgba(0,0,0,.32); }
.ban.now a.call { background: #fff; color: #b5241c; }
.ban.week button { background: color-mix(in srgb, var(--week) 14%, transparent); color: var(--week); } .ban.week button:hover { background: color-mix(in srgb, var(--week) 22%, transparent); }
@keyframes drop { from { transform: translateY(-100%); opacity: 0 } }
.view { flex: 1; min-height: 0; display: grid; }
.tb { height: 56px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 0.5px solid var(--sep); background: var(--bg); position: relative; z-index: 2; }
.tb .t { min-width: 0; padding: 0 6px; }
.tb .t b { display: block; font: 600 15px/1.3 var(--bnf); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb .t small { display: block; font: 400 12px/1.3 var(--bnf); color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb .sp { flex: 1; }
.tb h1 { font: 700 20px var(--bnf); margin: 0 6px; }
.ib { width: 34px; height: 34px; border: 0; background: none; border-radius: 8px; display: grid; place-items: center; color: var(--label2); cursor: pointer; flex: none; }
.ib:hover { background: var(--hover); color: var(--label); }
.ib:active { background: var(--fill); }
.ib[disabled] { opacity: .3; pointer-events: none; }
.zoom { font: 500 12px var(--sys); color: var(--label2); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.vsep { width: 0.5px; height: 20px; background: var(--sep); margin: 0 4px; }
.menu-btn { display: none; }
.pbtn { border: 0; border-radius: 8px; height: 32px; padding: 0 12px; font: 600 14px var(--bnf); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: var(--tint); color: var(--on-tint); white-space: nowrap; }
.pbtn:hover { filter: brightness(1.06); } .pbtn:active { transform: scale(.97); }
.pbtn.ghost { background: var(--fill); color: var(--label); }

/* Chat view: paper | conversation */
.view.chat { grid-template-columns: minmax(0, 1fr) var(--cw, 400px); }
.viewer { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); border-right: 0.5px solid var(--sep); }
.canvas { flex: 1; overflow: auto; padding: 32px 28px 40px; display: flex; justify-content: center; align-items: flex-start; }
.film { flex: none; display: flex; gap: 10px; padding: 10px 14px 12px; overflow-x: auto; background: var(--bg); border-top: 0.5px solid var(--sep); }
.fi { flex: none; width: 76px; border: 0; background: none; cursor: pointer; display: grid; gap: 5px; justify-items: center; font: 500 11px/1.3 var(--bnf); color: var(--label2); padding: 3px 0 0; border-radius: 8px; }
.fi .mini { width: 64px; height: 80px; border-radius: 4px; overflow: hidden; position: relative; box-shadow: 0 0 0 0.5px var(--sep), 0 2px 6px rgba(0,0,0,.08); transition: box-shadow 160ms, transform 160ms; background: var(--paper); }
.fi:hover .mini { transform: translateY(-2px); }
.fi[aria-current="true"] .mini { box-shadow: 0 0 0 2.5px var(--tint), 0 4px 10px rgba(0,0,0,.12); }
.fi[aria-current="true"] { color: var(--label); font-weight: 600; }
.fi .mini .page { zoom: .103; pointer-events: none; }
.fi .dot { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1.5px #fff; }
.dot.now { background: var(--now-fill); } .dot.week { background: #f29100; } .dot.ok { background: #20a07a; } .dot.unk, .dot.retake { background: #8e8e93; } .dot.rx { background: var(--label3); }
.fi.new { animation: popin 560ms cubic-bezier(.2,1.4,.4,1) both; }
@keyframes popin { from { transform: scale(.4); opacity: 0 } }

/* The paper */
.page { width: 640px; flex: none; background: var(--paper); color: #222; box-shadow: var(--shadow); border-radius: 2px; padding: 40px 46px 34px; font: 12.5px/1.55 var(--sys); zoom: var(--z, 1); position: relative; }
.page .lh { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 2px solid #1d4e89; }
.page .lg { width: 38px; height: 38px; border-radius: 50%; background: #1d4e89; color: #fff; display: grid; place-items: center; font: 700 14px var(--sys); flex: none; }
.page .lh b { display: block; font: 700 18px var(--sys); color: #1d4e89; letter-spacing: .01em; }
.page .lh small { display: block; color: #555; font-size: 11px; }
.page .pi { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; margin: 12px 0 4px; padding: 8px 10px; background: #f4f5f7; border-radius: 3px; font-size: 11.5px; color: #333; }
.page h4, .page .h4 { text-align: center; font: 700 13px var(--sys); letter-spacing: .12em; margin: 16px 0 8px; text-decoration: underline; text-underline-offset: 4px; color: #222; }
.page table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.page th { text-align: left; font-size: 11px; color: #555; border-bottom: 1px solid #999; padding: 5px 6px; font-weight: 600; }
.page td { padding: 6px; border-bottom: 1px dotted #c8c8c8; }
.page tr { transition: background 200ms; }
.page td.res { font-weight: 600; }
.page td.res.flag { font-weight: 800; }
.page tr.focus td, .page .ml.focus { background: rgba(255, 210, 0, .38); }
.page tr.flash td, .page .ml.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { background: rgba(255, 200, 0, .7) } 100% { background: transparent } }
.page .cm { margin: 14px 0 0; font-size: 11.5px; color: #444; }
.page .sig { display: flex; justify-content: space-between; margin-top: 46px; font-size: 11px; color: #444; }
.page .sig b { display: block; font-size: 12px; color: #222; } .page .sig small { display: block; }
.page .sg { display: block; font: 600 22px/1 "Caveat", cursive; color: #2b3f8c; margin-bottom: 2px; }
.page .ft { margin-top: 22px; padding-top: 8px; border-top: 1px solid #ddd; font-size: 10px; color: #5f5f5f; text-align: center; }
.mini .page small, .mini .page .ft { color: #555 !important; }
.page.blurry { filter: blur(2.6px) brightness(.97); transform: rotate(-1.2deg); }
.page.rx .rxh { display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 2px solid #0b6e4f; }
.page.rx .rxh b { display: block; font: 700 18px var(--sys); color: #0b6e4f; } .page.rx .rxh small { display: block; color: #555; font-size: 11px; }
.page.rx .rxh .r { text-align: right; }
.page.rx .pi { grid-template-columns: 2fr 1fr 1fr; }
.rxb { display: grid; grid-template-columns: 160px 1fr; gap: 22px; margin-top: 14px; min-height: 380px; }
.rxb .cc { border-right: 1px solid #ddd; padding-right: 14px; font-size: 11.5px; }
.rxb .cc b { display: block; margin-top: 10px; color: #333; }
.hw { font: 600 21px/1.35 "Caveat", cursive; color: #1f2f7a; margin: 0; }
.hw.bn { font: 400 17px/1.6 "Galada", var(--bnf); }
.rxsym { font: 700 30px/1 Georgia, serif; color: #0b6e4f; display: block; margin-bottom: 8px; }
.ml { padding: 4px 6px; margin: 0 -6px 10px; border-radius: 4px; transition: background 200ms; }

/* Conversation */
.convo { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); position: relative; }
.convo .tb { gap: 10px; }
.mmk { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(160deg, #3cc493, #0a7a62 70%); display: grid; place-items: center; flex: none; }
.mmk svg { width: 18px; height: 18px; stroke: #fff; stroke-width: 2.2; }
.thread { flex: 1; overflow-y: auto; padding: 4px 18px 12px; overscroll-behavior: contain; }
.stamp { text-align: center; font: 500 13px var(--bnf); color: var(--label2); margin: 18px 0 8px; }
.stamp b { font-weight: 600; }
.msg { display: flex; flex-direction: column; margin: 2px 0; }
.msg.me { align-items: flex-end; } .msg.them { align-items: flex-start; }
.b { max-width: 84%; padding: 7px 13px 8px; border-radius: 18px; font: 400 15.5px/1.5 var(--bnf); position: relative; overflow-wrap: anywhere; }
.them .b { background: var(--recv); color: var(--recv-ink); }
.me .b { background: var(--sent); color: #fff; }
.msg.tail .b::before, .msg.tail .b::after { content: ""; position: absolute; bottom: 0; height: 17px; }
.msg.tail.them .b::before { left: -7px; width: 20px; background: var(--recv); border-bottom-right-radius: 16px 14px; }
.msg.tail.them .b::after { left: -26px; width: 26px; background: var(--bg); border-bottom-right-radius: 10px; }
.msg.tail.me .b::before { right: -7px; width: 20px; background: var(--sent); border-bottom-left-radius: 16px 14px; }
.msg.tail.me .b::after { right: -26px; width: 26px; background: var(--bg); border-bottom-left-radius: 10px; }
.receipt { font: 500 13px var(--bnf); color: var(--label2); margin: 3px 6px 2px; text-align: right; }
.gap { height: 8px; }
.attach { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 16px; overflow: hidden; display: block; box-shadow: 0 0 0 0.5px var(--sep); transition: box-shadow 160ms; }
.attach .mini { width: 168px; height: 200px; overflow: hidden; background: var(--paper); }
.attach .mini .page { zoom: .262; pointer-events: none; box-shadow: none; }
.attach.sel { box-shadow: 0 0 0 2.5px var(--tint); }
.attach:hover { filter: brightness(.97); }
.card { width: min(320px, 92%); background: var(--recv); border-radius: 18px; overflow: hidden; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--recv-ink); display: block; transition: box-shadow 200ms; }
.card.sel { box-shadow: 0 0 0 2.5px var(--tint); }
.card.pulse { animation: pulse 900ms ease-out; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--tint) 60%, transparent) } 100% { box-shadow: 0 0 0 12px transparent } }
.card .band { display: flex; align-items: center; gap: 7px; padding: 8px 13px; font: 600 14px/1.4 var(--bnf); }
.band.now { background: var(--now-fill); color: #fff; } .band.week { background: var(--week-soft); color: var(--week); }
.card .meta { padding: 10px 13px 6px; }
.card .meta b { display: block; font: 700 20px/1.3 var(--bnf); }
.card .meta small { display: block; font: 400 12.5px/1.4 var(--bnf); color: var(--label2); margin-top: 1px; }
.card .rows { padding: 2px 6px 8px; }
.r { display: flex; align-items: center; justify-content: space-between; gap: 8px; font: 400 14px/1.35 var(--sys); padding: 5px 7px; border-radius: 8px; }
.r:hover { background: var(--hover); }
.r .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.r .rr { display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 0 8px; font: 600 13px/1.7 var(--bnf); white-space: nowrap; }
.chip svg { width: 12px; height: 12px; stroke-width: 2.5; }
.chip.in, .chip.ok { background: var(--tint-soft); color: var(--tint-ink); } .chip.out, .chip.week { background: var(--week-soft); color: var(--week); }
.chip.crit, .chip.now { background: var(--now-soft); color: var(--now-ink); } .chip.unk, .chip.retake { background: var(--unk-soft); color: var(--label2); } .chip.rx { background: var(--fill); color: var(--label2); }
.card .open { display: flex; align-items: center; gap: 4px; padding: 8px 13px 10px; border-top: 0.5px solid var(--sep); font: 500 13px var(--bnf); color: var(--tint); }
.typing { display: inline-flex; gap: 4px; align-items: center; height: 36px; padding: 0 14px; background: var(--recv); border-radius: 18px; position: relative; }
.typing::before { content: ""; position: absolute; left: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--recv); }
.typing::after { content: ""; position: absolute; left: -6px; bottom: -6px; width: 6px; height: 6px; border-radius: 50%; background: var(--recv); }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--label3); animation: tp 1.3s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; } .typing i:nth-child(3) { animation-delay: .36s; }
@keyframes tp { 0%, 70%, 100% { opacity: .35; transform: scale(.88) } 35% { opacity: 1; transform: scale(1) } }
.in-me { animation: inMe 440ms cubic-bezier(.18,1.15,.3,1) both; transform-origin: 100% 100%; }
.in-them { animation: inThem 360ms cubic-bezier(.2,1.1,.3,1) both; transform-origin: 0 100%; }
@keyframes inMe { from { transform: translate(-6px, 54px) scale(.7); opacity: 0 } 40% { opacity: 1 } }
@keyframes inThem { from { transform: scale(.82); opacity: 0 } }
.suggest { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 0 2px; }
.suggest button { border: 1px solid var(--sep); background: var(--bg); color: var(--tint); border-radius: 16px; padding: 4px 12px; font: 500 14px var(--bnf); cursor: pointer; }
.suggest button:hover { background: var(--tint-soft); border-color: transparent; }
.composer { flex: none; padding: 8px 14px 14px; display: flex; align-items: flex-end; gap: 8px; }
.attachb { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill); color: var(--label2); display: grid; place-items: center; cursor: pointer; flex: none; }
.attachb:hover { color: var(--tint); background: var(--tint-soft); }
.field { flex: 1; min-height: 34px; border-radius: 17px; border: 1px solid var(--sep); display: flex; align-items: center; padding: 1px 3px 1px 14px; background: var(--bg); transition: border-color 150ms; }
.field:focus-within { border-color: color-mix(in srgb, var(--tint) 55%, var(--sep)); }
.field input { flex: 1; border: 0; background: none; outline: 0; font: 400 15.5px var(--bnf); min-width: 0; padding: 4px 0; }
.field input::placeholder { color: var(--label2); }
.send { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--sent); color: #fff; place-items: center; cursor: pointer; flex: none; display: none; }
.send.on { display: grid; animation: popin 260ms cubic-bezier(.3,1.5,.5,1) both; }
.send svg { width: 16px; height: 16px; stroke-width: 2.6; }
.hint { font: 400 12.5px var(--bnf); color: var(--label2); text-align: center; padding: 0 14px 10px; margin-top: -6px; }

/* Empty / first run */
.dropzone { margin: auto; width: min(560px, 90%); border: 2px dashed color-mix(in srgb, var(--tint) 45%, var(--sep)); border-radius: 20px; padding: 48px 32px; text-align: center; background: color-mix(in srgb, var(--bg) 70%, transparent); }
.dropzone .big { width: 64px; height: 64px; border-radius: 18px; background: var(--tint-soft); color: var(--tint); display: grid; place-items: center; margin: 0 auto 14px; }
.dropzone .big svg { width: 32px; height: 32px; }
.dropzone h2 { font: 700 22px/1.35 var(--bnf); margin: 0 0 6px; }
.dropzone p { margin: 0 0 18px; color: var(--label2); }

/* Calendar view */
.view.cal { grid-template-columns: minmax(0, 1fr) 340px; }
.calwrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.mhead, .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mhead span { font: 500 12px var(--bnf); color: var(--label2); padding: 8px 10px 6px; text-align: right; border-bottom: 0.5px solid var(--sep); }
.mhead span.fri { color: var(--label2); }
.month { flex: 1; grid-auto-rows: minmax(96px, 1fr); overflow: auto; }
.mday { border: 0; border-right: 0.5px solid var(--sep); border-bottom: 0.5px solid var(--sep); background: none; padding: 5px 6px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; overflow: hidden; }
.mday:hover { background: var(--hover); }
.mday.sel { background: var(--selbg); }
.mday.blank { pointer-events: none; background: color-mix(in srgb, var(--bg2) 60%, transparent); }
.mday .dn { align-self: flex-end; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 20px var(--bnf); font-variant-numeric: tabular-nums; }
.mday.fri .dn { color: var(--label2); }
.mday.today .dn { background: var(--label); color: var(--bg); font-weight: 700; }
.mday.ring .dn { box-shadow: 0 0 0 2px var(--tint); }
.ev { display: flex; align-items: center; gap: 5px; font: 500 12px/1.5 var(--bnf); padding: 1px 6px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--fill); color: var(--label); }
.ev i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.ev.week { background: var(--week-soft); color: var(--week); } .ev.now { background: var(--now-soft); color: var(--now); }
.ev.visit { background: none; box-shadow: inset 0 0 0 1.5px var(--tint); color: var(--tint); font-weight: 600; }
.insp { border-left: 0.5px solid var(--sep); background: var(--bg2); overflow-y: auto; min-height: 0; padding: 18px 16px 28px; }
.insp h2 { font: 700 20px var(--bnf); margin: 2px 4px 12px; }
.ic { background: var(--bg3); border-radius: 14px; padding: 12px; margin-bottom: 12px; box-shadow: 0 0 0 0.5px var(--sep); }
.ic .row { display: flex; gap: 12px; align-items: flex-start; }
.ic .mini { width: 60px; height: 76px; border-radius: 4px; overflow: hidden; flex: none; box-shadow: 0 0 0 0.5px var(--sep); background: var(--paper); }
.ic .mini .page { zoom: .095; pointer-events: none; box-shadow: none; }
.ic b { display: block; font: 600 15px/1.4 var(--bnf); } .ic small { display: block; font: 400 12.5px/1.45 var(--bnf); color: var(--label2); }
.ic .vd { margin: 10px 0 10px; font: 600 14px/1.45 var(--bnf); }
.ic .acts { display: flex; gap: 8px; }
.empty-note { color: var(--label2); text-align: center; padding: 24px 12px; font-size: 14px; }

/* Labs */
.view.labs { grid-template-columns: 340px minmax(0, 1fr); }
.list { border-right: 0.5px solid var(--sep); overflow-y: auto; min-height: 0; padding: 6px 10px 20px; }
.lh3 { font: 600 12px var(--bnf); color: var(--label2); margin: 14px 8px 4px; }
.lr { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 8px 10px; border-radius: 10px; cursor: pointer; text-align: left; }
.lr:hover { background: var(--hover); }
.lr[aria-current="true"] { background: var(--selbg); }
.lr .nm { flex: 1; min-width: 0; font: 500 14.5px/1.35 var(--sys); }
.lr .nm small { display: block; font: 400 12px var(--bnf); color: var(--label2); }
.lr .vv { text-align: right; font: 600 15px var(--sys); font-variant-numeric: tabular-nums; display: grid; justify-items: end; gap: 2px; }
.lr .vv small { font: 400 11px var(--sys); color: var(--label2); }
.detail { overflow-y: auto; min-height: 0; background: var(--bg2); padding: 26px 34px 40px; }
.detail .big { font: 700 44px/1.1 var(--sys); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.detail .big small { font: 500 18px var(--sys); color: var(--label2); letter-spacing: 0; margin-left: 4px; }
.detail .sub { color: var(--label2); margin: 6px 0 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.panel { background: var(--bg3); border-radius: 16px; padding: 18px; box-shadow: 0 0 0 0.5px var(--sep); margin-bottom: 16px; }
.panel h3, .panel h2.ph { font: 600 15px var(--bnf); margin: 0 0 10px; }
.panel .foot { font: 400 13px/1.55 var(--bnf); color: var(--label2); margin: 10px 0 0; }
.src { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-top: 0.5px solid var(--sep); width: 100%; border-left: 0; border-right: 0; border-bottom: 0; background: none; text-align: left; cursor: pointer; border-radius: 0; }
.src:first-of-type { border-top: 0; }
.src:hover { background: var(--hover); }
.src .grow { flex: 1; }
.crop { background: var(--paper); color: #222; font: 12.5px/1.5 var(--sys); padding: 6px 10px; border-radius: 6px; box-shadow: 0 0 0 0.5px rgba(0,0,0,.12); display: grid; grid-template-columns: 1fr auto auto; gap: 14px; font-variant-numeric: tabular-nums; }
.crop .hl { background: rgba(255,210,0,.45); padding: 0 3px; border-radius: 3px; }
.crop.hwc { display: block; font: 600 20px/1.35 "Caveat", cursive; color: #1f2f7a; }
.crop.hwc .bn { font: 400 16px/1.6 "Galada", var(--bnf); }

/* Single-column pages: medicines, coming soon, settings */
.page-col { overflow-y: auto; min-height: 0; background: var(--bg2); }
.col { max-width: 720px; margin: 0 auto; padding: 28px 28px 60px; }
.col h2 { font: 700 26px/1.3 var(--bnf); margin: 0 0 4px; }
.col .lede { color: var(--label2); margin: 0 0 22px; }
.group { background: var(--bg3); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 0.5px var(--sep); }
.gh { font: 400 13px var(--bnf); color: var(--label2); margin: 24px 14px 6px; }
.gf { font: 400 13px/1.5 var(--bnf); color: var(--label2); margin: 6px 14px 0; }
.cell { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 14px; border: 0; background: none; width: 100%; text-align: left; position: relative; color: var(--label); font: 400 15px/1.4 var(--bnf); }
button.cell { cursor: pointer; } button.cell:hover { background: var(--hover); }
.cell + .cell::before { content: ""; position: absolute; top: 0; left: 14px; right: 0; height: 0.5px; background: var(--sep); }
.cell .grow { flex: 1; min-width: 0; } .cell small { display: block; font-size: 13px; color: var(--label2); }
.cell .val { color: var(--label2); }
.cell .tick { color: var(--tint); }
.medcard { padding: 14px; }
.medcard + .medcard { border-top: 0.5px solid var(--sep); }
.medcard .tx { margin: 8px 0 0; font: 500 15px/1.5 var(--bnf); }
.medcard .src2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font: 400 13px var(--bnf); color: var(--label2); }
.soonpage { display: grid; place-items: center; text-align: center; padding: 80px 28px; }
.soonpage .sq { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; color: #fff; margin: 0 auto 18px; }
.soonpage .sq svg { width: 36px; height: 36px; stroke-width: 1.8; }
.soonpage h2 { font: 700 24px/1.35 var(--bnf); margin: 0 0 8px; }
.soonpage p { color: var(--label2); max-width: 46ch; margin: 0 auto 8px; }
.soonpage ul { text-align: left; max-width: 420px; margin: 18px auto 22px; padding: 0; list-style: none; }
.soonpage li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 0.5px solid var(--sep); }
.soonpage li svg { color: var(--tint); margin-top: 3px; width: 18px; height: 18px; }
.sw { width: 42px; height: 26px; border-radius: 13px; background: var(--fill); border: 0; position: relative; cursor: pointer; flex: none; transition: background 250ms; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform 300ms cubic-bezier(.3,1.3,.5,1); }
.sw[aria-checked="true"] { background: var(--tint); } .sw[aria-checked="true"]::after { transform: translateX(16px); }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--fill); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; border-radius: 6px; height: 28px; padding: 0 14px; font: 500 13px var(--bnf); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bg3); box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 0 0 0.5px rgba(0,0,0,.04); font-weight: 600; }

/* Overlays */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; opacity: 0; transition: opacity 260ms; }
.scrim.on { opacity: 1; }
.dlg { position: fixed; left: 50%; top: 50%; z-index: 61; width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow-y: auto; background: var(--bg3); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.3), 0 0 0 0.5px var(--sep); padding: 22px; transform: translate(-50%, -50%) scale(.96); opacity: 0; transition: transform 380ms cubic-bezier(.2,1.1,.3,1), opacity 200ms; }
.dlg.on { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.dlg h2 { font: 700 20px/1.35 var(--bnf); margin: 0 0 4px; }
.dlg p { color: var(--label2); margin: 0 0 16px; }
.dlg .acts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.dlg .pbtn { height: 36px; padding: 0 16px; }
.pbtn.red { background: var(--now-fill); }
.tray { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 12px; }
.pg { flex: none; width: 110px; }
.pg .mini { width: 110px; height: 136px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 0.5px var(--sep), 0 4px 12px rgba(0,0,0,.1); background: var(--paper); position: relative; }
.pg .mini .page { zoom: .172; pointer-events: none; box-shadow: none; }
.pg .mini span { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.7); color: #fff; font: 600 12px var(--bnf); border-radius: 8px; padding: 0 7px; }
.pg small { display: block; font: 400 12px var(--sys); color: var(--label2); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg.add { height: 136px; border: 1.5px dashed var(--label3); border-radius: 8px; display: grid; place-items: center; background: none; color: var(--label2); cursor: pointer; }
.pop { position: fixed; z-index: 70; background: var(--bar); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.2), 0 0 0 0.5px var(--sep); padding: 6px; min-width: 260px; max-width: 340px; transform-origin: 20px 0; animation: popm 220ms cubic-bezier(.2,1.2,.3,1) both; }
@keyframes popm { from { transform: scale(.85); opacity: 0 } }
.pop button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; border-radius: 7px; padding: 7px 10px; font: 400 14px var(--bnf); cursor: pointer; text-align: left; }
.pop button:hover, .pop button.hi { background: var(--tint); color: var(--on-tint); }
.pop button:hover small, .pop button.hi small { color: rgba(255,255,255,.85); }
.pop button small { display: block; font-size: 12px; color: var(--label2); }
.pop .ph { font: 600 11px var(--bnf); color: var(--label2); padding: 6px 10px 2px; }
.drop { position: fixed; inset: 10px; z-index: 80; border: 3px dashed var(--tint); border-radius: 22px; background: color-mix(in srgb, var(--tint) 10%, transparent); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); display: none; place-items: center; font: 700 24px var(--bnf); color: var(--tint); pointer-events: none; }
.drop.on { display: grid; }
.toast { position: fixed; left: 50%; bottom: 96px; z-index: 90; background: var(--bar); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border-radius: 20px; padding: 9px 16px; font: 500 14px var(--bnf); display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 26px rgba(0,0,0,.16), 0 0 0 0.5px var(--sep); white-space: nowrap; transform: translate(-50%, 12px); opacity: 0; visibility: hidden; transition: transform 240ms cubic-bezier(.2,.8,.2,1), opacity 240ms, visibility 0s 240ms; }
.toast.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform 240ms cubic-bezier(.2,.8,.2,1), opacity 240ms; }
.toast svg { color: var(--green); }
.proto { position: fixed; left: calc(var(--sw, 256px) + (100vw - var(--sw, 256px) - var(--cw, 400px)) / 2); bottom: 132px; transform: translateX(-50%); z-index: 85; display: flex; gap: 4px; align-items: center; padding: 5px; border-radius: 999px; background: rgba(28,28,30,.86); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,.25); font: 500 12.5px var(--bnf); }
.proto span { color: rgba(255,255,255,.55); padding: 0 8px 0 10px; }
.proto button, .proto a { border: 0; background: none; color: #fff; padding: 5px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.proto button:hover, .proto a:hover { background: rgba(255,255,255,.14); }
.proto button[aria-pressed="true"] { background: #fff; color: #111; }
.proto .x { padding: 5px 8px; }
.proto.min > :not(.x) { display: none; }

/* Sign-in */
.signin { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); height: 100vh; height: 100dvh; overflow: auto; background: var(--bg); }
.hero { background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--tint) 16%, var(--bg2)), var(--bg2) 60%); padding: 56px 64px; display: flex; flex-direction: column; gap: 28px; border-right: 0.5px solid var(--sep); overflow: hidden; }
.hero .brand { padding: 0; height: auto; }
.hero h1 { font: 700 40px/1.25 var(--bnf); margin: 0; max-width: 16ch; text-wrap: balance; }
.hero .lede { font: 400 18px/1.6 var(--bnf); color: var(--label2); margin: 0; max-width: 44ch; }
.demo { max-width: 440px; background: var(--bg); border-radius: 22px; padding: 16px 30px 18px; box-shadow: var(--shadow); }
.demo .msg { animation: inThem 500ms cubic-bezier(.2,1.1,.3,1) both; }
.demo .msg.me { animation-name: inMe; }
.formside { display: grid; place-items: center; padding: 40px 28px; }
.form { width: min(380px, 100%); }
.form h2 { font: 700 28px/1.3 var(--bnf); margin: 0 0 6px; }
.form .sub { color: var(--label2); margin: 0 0 24px; }
.inset { background: var(--bg2); border-radius: 12px; box-shadow: 0 0 0 0.5px var(--sep); }
.inset:focus-within { box-shadow: 0 0 0 2px var(--tint); }
.inset .cty { display: flex; justify-content: space-between; padding: 11px 14px; font: 400 15px var(--bnf); border-bottom: 0.5px solid var(--sep); color: var(--label2); }
.inset .cty b { color: var(--label); font-weight: 500; }
.inset label { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 54px; }
.inset label b { font: 500 19px var(--sys); color: var(--label2); }
.inset input { border: 0; background: none; outline: 0; font: 500 20px var(--sys); width: 100%; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.inset input::placeholder { color: var(--label2); }
.err { color: var(--now); font: 400 13.5px var(--bnf); min-height: 22px; margin: 8px 2px 0; }
.wide { width: 100%; height: 46px; font-size: 16px; justify-content: center; border-radius: 12px; margin-top: 6px; }
.pbtn[aria-disabled="true"] { opacity: .4; }
.fine { font: 400 12.5px/1.55 var(--bnf); color: var(--label2); text-align: center; margin: 14px 0 0; }
.otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.otp input { width: 100%; height: 60px; text-align: center; font: 600 26px var(--sys); border: 0; background: var(--bg2); border-radius: 12px; outline: 0; box-shadow: 0 0 0 0.5px var(--sep); caret-color: var(--tint); }
.otp input:focus { box-shadow: 0 0 0 2px var(--tint); }
.otp.bad { animation: shake 420ms; } .otp.bad input { box-shadow: 0 0 0 2px var(--now); } .otp.good input { box-shadow: 0 0 0 2px var(--green); }
@keyframes shake { 20%, 60% { transform: translateX(-9px) } 40%, 80% { transform: translateX(9px) } }
.sent { display: flex; gap: 12px; align-items: center; background: var(--bg2); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; box-shadow: 0 0 0 0.5px var(--sep); }
.sent .wa { width: 36px; height: 36px; border-radius: 10px; background: #25d366; color: #fff; display: grid; place-items: center; flex: none; animation: popin 520ms cubic-bezier(.2,1.4,.4,1) both; }
.sent b { display: block; font: 600 15px var(--bnf); } .sent small { color: var(--label2); font-size: 13px; }
.linkb { border: 0; background: none; color: var(--tint); font: 500 14px var(--bnf); cursor: pointer; padding: 8px 0; }
.linkb[disabled] { color: var(--label3); cursor: default; }
.done { text-align: center; } .done .tk { width: 76px; height: 76px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; animation: popin 560ms cubic-bezier(.2,1.4,.4,1) both; } .done .tk svg { width: 40px; height: 40px; stroke-width: 3; }

/* Narrower windows: the sidebar becomes an icon rail, then an overlay; the paper opens over the conversation. */
@media (max-width: 1199px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: 280px; transform: translateX(-102%); transition: transform 380ms cubic-bezier(.2,.9,.25,1); box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .app.sideopen .side { transform: none; }
  .menu-btn { display: grid; }
  .view.labs { grid-template-columns: 300px minmax(0, 1fr); }
  .view.cal { grid-template-columns: minmax(0, 1fr) 300px; }
}
@media (max-width: 899px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: 290px; transform: translateX(-102%); transition: transform 380ms cubic-bezier(.2,.9,.25,1); box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .app.sideopen .side { transform: none; }
  .side .lbl, .side .sgh, .side .search, .side .nextup, .side .cnt, .side .soon, .brand b, .brand .sp, .brand .ib { display: revert; }
  .side .sgh, .side .search { display: flex; } .side .nextup { display: flex; }
  .si { justify-content: flex-start; padding: 0 8px; min-height: 38px; }
  .brand { justify-content: flex-start; padding: 0 10px 0 16px; }
  .snav { padding: 0 10px 10px; }
  .menu-btn { display: grid; }
  .view.chat { grid-template-columns: minmax(0, 1fr); }
  .viewer { display: none; }
  .app.paperopen .viewer { display: flex; position: fixed; inset: 0; z-index: 40; }
  .viewer .closepaper { display: grid !important; }

  function chart(L) {

      case "sendpaper": sendPaper(); break;
      case "sendtext": { const v = document.getElementById("msgIn").value.trim(); if (v) sendText(v); break; }
      case "ack": st.ack[st.patient] = true; render(); toast("ঠিক আছে — কাগজটা ক্যালেন্ডারে থাকছে"); break;
      case "rem": st.reminders = !st.reminders; el.setAttribute("aria-checked", String(st.reminders)); tick(); break;
      case "addperson": openDlg(`<h2>কার কাগজ রাখবেন?</h2><p>নাম আর সম্পর্ক দিলেই হবে। পরে বয়স আর অসুখ যোগ করতে পারবেন।</p><div class="group">${["মা", "বাবা", "নিজে", "নানি", "দাদা", "শ্বশুর", "শাশুড়ি"].map((r) => `<button class="cell" data-action="added"><span class="grow">${r}</span></button>`).join("")}</div><div class="acts"><button class="pbtn ghost" data-action="closedlg">বাদ দিন</button></div>`); break;
      case "added": closeDlg(); toast("যোগ করার ফর্ম শিগগিরই"); break;
      case "lang": toast("English শিগগিরই"); break;
      case "soon": toast("শিগগিরই আসছে"); break;
      case "togglesoon": st.soonOpen = !st.soonOpen; render(); break;
      case "signout": setScene("signin"); break;
      case "openside": st.sideOpen = true; document.getElementById("app").classList.add("sideopen"); break;
      case "closeside": if (matchMedia("(max-width: 899px)").matches) { st.sideOpen = false; document.getElementById("app").classList.remove("sideopen"); } else toast("সাইডবার ছোট করতে জানালা সরু করুন"); break;
      case "closepaper": st.paperOpen = false; document.getElementById("app").classList.remove("paperopen"); break;
      case "toCode": if (!valid(st.number)) { document.getElementById("err").textContent = "নম্বরটা ঠিক মনে হচ্ছে না — যেমন 1712-345678"; return; } st.auth = "code"; render(); break;
      case "toNumber": st.auth = "number"; render(); break;
      case "resend": toast("নতুন কোড WhatsApp-এ পাঠিয়েছি"); el.disabled = true; break;
    }
  });
  // Hovering a line of Medioo's answer lights up that line on the paper beside it.
  document.addEventListener("mouseover", (e) => { const r = e.target.closest(".card [data-row]"); if (!r) return; const [id] = r.dataset.row.split(":"); if (curPaper()?.id === id) focusRow(r.dataset.row, false); });
  document.addEventListener("mouseout", (e) => { const r = e.target.closest(".card [data-row]"); if (r && !r.contains(e.relatedTarget)) document.querySelectorAll(".canvas .focus").forEach((n) => n.classList.remove("focus")); });
  document.addEventListener("keydown", (e) => {
    const typing = e.target.closest && e.target.closest("input");
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); const q = document.getElementById("q"); if (q) { if (matchMedia("(max-width: 899px)").matches) { st.sideOpen = true; document.getElementById("app").classList.add("sideopen"); } q.focus(); } return; }
    if (e.key === "Escape") { if (vstate) voiceClose(); else if (dlg) closeDlg(); else if (pop) closePop(); else if (st.paperOpen) { st.paperOpen = false; document.getElementById("app")?.classList.remove("paperopen"); } else if (st.sideOpen) { st.sideOpen = false; document.getElementById("app")?.classList.remove("sideopen"); } return; }
    if (typing || dlg || st.scene === "signin" || st.view !== "chat") return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); document.querySelector(`[data-action="${e.key === "ArrowLeft" ? "prev" : "next"}"]`)?.click(); }
    if (e.key === "Enter" && (e.target.closest("[data-row]") || e.target.closest("[data-card]"))) (e.target.closest("[data-row]") || e.target.closest("[data-card]")).click();
  });
  document.getElementById("filein").addEventListener("change", (e) => { const names = [...e.target.files].map((f) => f.name); e.target.value = ""; if (names.length) uploadDlg(names); });
  let dragN = 0; const drop = document.getElementById("drop");
  window.addEventListener("dragenter", (e) => { if (st.scene === "signin" || !e.dataTransfer?.types?.includes("Files")) return; e.preventDefault(); dragN++; drop.classList.add("on"); });
  window.addEventListener("dragover", (e) => { if (drop.classList.contains("on")) e.preventDefault(); });
  window.addEventListener("dragleave", () => { if (--dragN <= 0) { dragN = 0; drop.classList.remove("on"); } });
  window.addEventListener("drop", (e) => { if (!drop.classList.contains("on")) return; e.preventDefault(); dragN = 0; drop.classList.remove("on"); uploadDlg([...e.dataTransfer.files].map((f) => f.name)); });
  // The upload button in this prototype opens the file picker; when a browser refuses it (some previews do), fall back to the dialog with sample pages.
  document.getElementById("filein").addEventListener("cancel", () => uploadDlg([]));

  // Voice: say what you need, and Medioo does it. One parser for every surface; each surface supplies its own executor.
  const MARKERS = [["HbA1c", /hba1c|এইচবিএ|সুগার|ডায়াবেটিস|sugar/i], ["Serum Creatinine", /creatinine|ক্রিয়েটিনিন|ক্রিয়েটিনিন|কিডনি/i], ["Serum Potassium", /potassium|পটাশিয়াম|পটাসিয়াম/i], ["Haemoglobin", /haemoglobin|hemoglobin|হিমোগ্লোবিন/i], ["LDL Cholesterol", /cholesterol|কোলেস্টেরল|lipid|লিপিড/i]];
  function parseCommand(text) {
    const s = text.trim(), c = {};
    if (/আব্বু|আব্বা|বাবা|abbu|father/i.test(s)) c.patient = "abbu"; else if (/আম্মা|আম্মু|মায়ের|মা\b|amma|mother/i.test(s)) c.patient = "amma";
    const m = MARKERS.find(([, re]) => re.test(s)); if (m) c.marker = m[0];
    const asks = /কত|কেমন|কী|কি\b|কেন|ঠিক আছে|\?|what|how/i.test(s), shows = /দেখাও|খোলো|খুলুন|দেখান|গ্রাফ|show|open/i.test(s);
    if (/নাজমা|বোন|শেয়ার|share/i.test(s)) c.do = "share";
    else if (/জরুরি|খারাপ|দেখার আছে|সমস্যা|urgent|কিছু হয়েছে/i.test(s)) c.do = "urgent";
    else if (/পাঠা|আপলোড|upload|নতুন কাগজ|ছবি তুল|স্ক্যান/i.test(s)) c.do = "upload";
    else if (c.marker) c.do = asks && !shows ? "ask" : "lab";
    else if (/ক্যালেন্ডার|calendar|কাগজপত্র|কবে যেতে|ডাক্তারের কাছে কবে/i.test(s)) c.do = "calendar";
    else if (/ওষুধ|ঔষধ|medicine/i.test(s)) c.do = asks && !shows ? "ask" : "meds";
    else if (/ল্যাব|মানগুলো|lab/i.test(s)) c.do = "labs";
    else if (/সর্বশেষ|শেষ রিপোর্ট|নতুন রিপোর্ট|আজকের|latest/i.test(s)) c.do = "latest";
    else if (/সেটিং|অ্যাকাউন্ট|settings/i.test(s)) c.do = "settings";
    else if (c.patient && s.split(/\s+/).length <= 3) c.do = "switch";
    else c.do = "ask";
    c.text = s; return c;
  }
  function describe(c) {
    const who = c.patient ? PATIENTS[c.patient].name + "র " : "";
    return { share: "নাজমাকে পাঠাচ্ছি", urgent: "দেখছি কারও কিছু জরুরি আছে কি না", upload: "নতুন কাগজ পাঠানোর জায়গা খুলছি", lab: `${who}${c.marker} খুলছি`, ask: "Medioo-কে জিজ্ঞেস করছি", calendar: `${who}ক্যালেন্ডার খুলছি`,
      meds: `${who}ওষুধ খুলছি`, labs: `${who}ল্যাবের মান খুলছি`, latest: `${who}সর্বশেষ কাগজ খুলছি`, settings: "সেটিংস খুলছি", switch: `${who}কাগজ খুলছি` }[c.do];
  }
  function urgentSummary() {
    const parts = [];
    Object.values(PATIENTS).forEach((q) => { const ps = (typeof papersOf === "function" ? papersOf(q.id) : []);
      ps.filter((p) => p.urgency === "now").forEach((p) => parts.push(`${q.name}র ${p.verdict.replace("।", "")} — এখনই ডাক্তারের কাছে নিয়ে যান।`));
      ps.filter((p) => p.urgency === "week").forEach((p) => parts.push(`${q.name}র ${p.verdict.replace("।", "")} — এ সপ্তাহের মধ্যে ডাক্তার দেখান।`)); });
    return parts.length ? parts.join(" ") : "এখন জরুরি কিছু নেই — সব কাগজের মান লেখা সীমার মধ্যে, বা আগেই দেখানো হয়েছে।";
  }
  const VOICE_EXAMPLES = ["আব্বুর Potassium দেখাও", "আম্মার HbA1c কত?", "ক্যালেন্ডার খোলো", "নতুন কাগজ পাঠাব", "কিছু জরুরি আছে?"];
  let rec = null, vstate = null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  function voiceOverlay(mode) {
    let o = document.getElementById("voice");
    if (!o) { o = document.createElement("div"); o.id = "voice"; o.className = "voice"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "কণ্ঠে বলুন"); document.body.append(o); }
    o.innerHTML = `<div class="vbox"><div class="vtop"><span class="vorb ${mode === "listen" ? "on" : ""}"><img src="mio-head.webp" alt=""></span><div class="vtx"><b id="vhead">${mode === "listen" ? "শুনছি…" : "কী করব বলুন বা লিখুন"}</b><span id="vlive">${mode === "listen" ? VOICE_HINT_LISTEN : "যেমন: “আব্বুর Potassium দেখাও”"}</span></div><span class="vwave ${mode === "listen" ? "on" : ""}" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
      ${mode === "type" ? `<div class="vin"><input id="vinput" placeholder="যেমন: আম্মার HbA1c কত?" aria-label="কমান্ড লিখুন" autocomplete="off"><button class="vgo" data-vgo="1" aria-label="করুন">${ic("up")}</button></div>` : ""}
      <div class="vex">${VOICE_EXAMPLES.map((x) => `<button data-vcmd="${x}">${x}</button>`).join("")}</div></div>`;
    requestAnimationFrame(() => o.classList.add("on"));
    if (mode === "type") setTimeout(() => { const i = document.getElementById("vinput"); if (i) { i.focus(); i.addEventListener("keydown", (e) => { if (e.key === "Enter" && i.value.trim()) runCommand(i.value); if (e.key === "Escape") voiceClose(); }); } }, 30);
  }
  function voiceClose() { const o = document.getElementById("voice"); if (o) { o.classList.remove("on"); setTimeout(() => o.remove(), 220); } vstate = null; try { rec && rec.abort(); } catch (e) {} rec = null; }
  function voiceStart() {
    if (vstate) return; vstate = { text: "" }; tick();
    if (!SR) { voiceOverlay("type"); document.getElementById("vlive").textContent = "এই ব্রাউজারে কণ্ঠ শোনা যায় না — লিখে দিন, বা নিচের একটা চাপুন"; vstate.typed = true; return; }
    voiceOverlay("listen");
    try {
      rec = new SR(); rec.lang = "bn-BD"; rec.interimResults = true; rec.continuous = true;
      rec.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; if (vstate) vstate.text = t; const l = document.getElementById("vlive"); if (l) l.textContent = t || VOICE_HINT_LISTEN; };
      rec.onerror = () => { if (!vstate || vstate.typed) return; vstate.typed = true; voiceOverlay("type"); document.getElementById("vlive").textContent = "মাইক্রোফোন পাওয়া গেল না — লিখে দিন, বা নিচের একটা চাপুন"; };
      rec.start();
    } catch (e) { vstate.typed = true; voiceOverlay("type"); }
  }
  function voiceStop() { if (!vstate || vstate.typed) return; const t = vstate.text; try { rec && rec.stop(); } catch (e) {} if (t.trim()) runCommand(t); else { vstate.typed = true; voiceOverlay("type"); document.getElementById("vlive").textContent = "কিছু শুনতে পাইনি — আবার ধরে রেখে বলুন, বা লিখে দিন"; } }
  function runCommand(text) {
    const c = parseCommand(text), h = document.getElementById("vhead"), l = document.getElementById("vlive");
    if (h) h.textContent = describe(c); if (l) l.textContent = `“${text}”`;
    document.querySelector(".vorb")?.classList.add("done"); ding();
    setTimeout(() => { voiceClose(); execCommand(c); }, 650);
  }
  function speak(text) { try { const v = speechSynthesis.getVoices().find((x) => /^bn/i.test(x.lang)); if (!v || !st.speak) return; const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }

  const VOICE_HINT_LISTEN = "বলুন — ⌥ ছেড়ে দিলে করে দেব";
  const papersOf = (id) => papers(id);
  function openSoundPicker() {
    openDlg(`<h2>শব্দ</h2><p>পাঠানো আর উত্তর আসার শব্দ বেছে নিন — চাপলে শুনতে পাবেন।</p>
      <div class="sgrp"><div class="srow"><span class="grow">শব্দ চালু<small>সব শব্দ একসাথে বন্ধ করা যায়</small></span><button class="sw" role="switch" aria-checked="${st.sound}" data-action="sndall" aria-label="শব্দ চালু"></button></div>
      <div class="srow" style="border-top:0.5px solid var(--sep)"><span class="grow">উত্তর জোরে পড়ে শোনানো<small>ব্রাউজারে বাংলা কণ্ঠ থাকলে</small></span><button class="sw" role="switch" aria-checked="${st.speak}" data-action="speakall" aria-label="উত্তর পড়ে শোনানো"></button></div></div>
      <div id="sndlist">${soundPickerHTML()}</div><div class="acts"><button class="pbtn" data-action="closedlg">ঠিক আছে</button></div>`);
  }
  const hasMarker = (pid, name) => papers(pid).some((p) => p.rows.some((r) => r[0] === name && r[5]));
  function execCommand(c) {
    if (st.scene === "signin") setScene("app");
    if (!c.patient && c.marker && !hasMarker(st.patient, c.marker)) { const other = Object.keys(PATIENTS).find((k) => hasMarker(k, c.marker)); if (other) c.patient = other; }
    if (c.patient) st.patient = c.patient;
    st.sideOpen = false;
    const askChat = (answer) => { st.view = "chat"; render(); sendMine(txt(c.text.replace(/</g, "&lt;"))); setTimeout(() => { const a = answer(); reply(a); setTimeout(() => speak(a), 1200); }, 500); };
    switch (c.do) {
      case "share": render(); toast("নাজমাকে পাঠানো হয়েছে — উনি WhatsApp-এ পাবেন"); break;
      case "urgent": askChat(urgentSummary); break;
      case "upload": st.view = "chat"; render(); uploadDlg([]); break;
      case "lab": st.view = "labs"; st.lab = c.marker; render(); break;
      case "ask": askChat(() => ANSWERS.find(([re]) => re.test(c.text))[1]()); break;
      case "calendar": st.view = "papers"; render(); break;
      case "meds": st.view = "meds"; render(); break;
      case "labs": st.view = "labs"; st.lab = null; render(); break;
      case "latest": { st.view = "chat"; const l = papers().slice(-1)[0]; if (l) st.sel[st.patient] = l.id; render(); break; }
      case "settings": st.view = "settings"; render(); break;
      case "switch": render(); toast(`${gen(st.patient)} কাগজ দেখাচ্ছি`); break;
    }
  }
  // ⌥/Alt: hold to talk, release to run. A quick tap opens the same panel for typing.
  let altAt = 0;
  document.addEventListener("keydown", (e) => {
    if (e.key === "Alt") { if (e.repeat || dlg || st.scene === "signin") return; e.preventDefault(); altAt = performance.now(); voiceStart(); return; }
    if (e.altKey && vstate && !vstate.typed) voiceClose();
  }, true);
  document.addEventListener("keyup", (e) => {
    if (e.key !== "Alt" || !vstate) return; e.preventDefault();
    if (performance.now() - altAt < 300 && !vstate.typed) { vstate.typed = true; try { rec && rec.abort(); } catch (x) {} voiceOverlay("type"); return; }
    voiceStop();
  }, true);
  document.addEventListener("click", (e) => {
    const sn = e.target.closest("[data-snd]");
    if (sn) { const [k, id] = sn.dataset.snd.split(":"); SND[k] = id; saveSnd(); const was = st.sound; st.sound = true; play(id); st.sound = was; document.getElementById("sndlist").innerHTML = soundPickerHTML(); return; }
    const sw = e.target.closest('[data-action="sndall"],[data-action="speakall"]');
    if (sw) { if (sw.dataset.action === "sndall") st.sound = !st.sound; else st.speak = !st.speak; sw.setAttribute("aria-checked", String(sw.dataset.action === "sndall" ? st.sound : st.speak)); if (st.sound) tick(); return; }
    const vc = e.target.closest("[data-vcmd]"); if (vc) { runCommand(vc.dataset.vcmd); return; }
    if (e.target.closest("[data-vgo]")) { const i = document.getElementById("vinput"); if (i && i.value.trim()) runCommand(i.value); return; }
    if (e.target.closest('[data-action="voice"]')) { if (vstate && !vstate.typed) voiceStop(); else if (vstate) voiceClose(); else voiceStart(); return; }
    if (vstate && !e.target.closest(".voice")) voiceClose();
  }, true);

  render();
})();
</script>
