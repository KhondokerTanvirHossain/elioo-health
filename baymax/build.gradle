/*
 * Baymax Module
 *
 * WhatsApp-first family health memory (MVP). Lives beside medscribe-ai in the same
 * Spring Boot deployable and is switched on with `baymax.enabled=true` (DR-2).
 *
 * Owns its own Postgres schema (`baymax`) and Flyway history; never touches the
 * medscribe schema. Reuses elioo-llm and elioo-gcp-vision; does not use
 * Comprehend Medical or GCP Translate.
 */
plugins {
    id 'java-library'
}

description = 'Baymax: WhatsApp-first family health memory'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.springframework.boot:spring-boot-starter-data-r2dbc'

    // Own Flyway instance (JDBC, startup only), separate from the medscribe one
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    // Object storage for images and crops (BMX-3): S3-compatible (AWS S3, Supabase Storage, MinIO locally).
    // Sync client on a bounded-elastic scheduler; no netty client to keep one netty in the app.
    implementation('software.amazon.awssdk:s3') {
        // one HTTP implementation only: the adapter uses url-connection-client explicitly
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    // PDF intake (BMX-2): render PDF pages to JPEG before storage, since storage is JPEG-only.
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    // Structured-output validation: the extraction reply is schema-checked, with one repair retry.
    // Pinned to 1.5.x on purpose: 3.x is a rewritten API (Schema/SchemaRegistry/Validator) and this code
    // uses the 1.5 JsonSchemaFactory/ValidationMessage surface.
    implementation 'com.networknt:json-schema-validator:1.5.8'

    implementation project(':elioo-llm')
    implementation project(':elioo-gcp-vision')

    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
    testImplementation 'org.testcontainers:minio:1.19.7'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    // progress.js (A9) runs in tests: a JS engine on the JVM, so the poll's behaviour is asserted, not its source text
    testImplementation 'org.openjdk.nashorn:nashorn-core:15.4'
    // the self-hosted fonts (D1) are checked by their content: a woff2's tables are one Brotli stream (Google's pure-Java decoder)
    testImplementation 'org.brotli:dec:0.1.2'
}

// A red test in CI prints its assertion message, not only "AssertionError at Foo.java:174": the page sweep's
// failure names what it matched and where (PhoneGuard), and that is only useful if the log shows it.
tasks.named('test') {
    testLogging {
        exceptionFormat = 'full'
    }
}
