# W5 (plan Wave 3, S8): the web composer. chat.field is the field's label (the prototype's placeholder); chat.ask.reply
# is what Medioo answers to a typed question until D11, as wa.fallback says it, and code appends safety.red_flag_line
# to it (home/chat-words.ts), as WhatsApp appends it to wa.fallback. Drafts for the copy owner.
chat.field=Medioo-কে লিখুন
chat.ask.reply=এই প্রশ্নের উত্তর আমি এখনো দিতে পারি না। ওষুধ বা শরীরের কোনো সমস্যা নিয়ে প্রশ্ন থাকলে ডাক্তারকে জিজ্ঞেস করুন।
# Plan CHAT-api (PO ruling P7, DR-50): the web চ্যাট answers. chat.ask.failed replaces a model answer that failed the code
# checks twice or did not arrive; chat.ask.limit is the day's question cap; code appends chat.dose.ask_doctor to every
# answer to a question that asks to start, stop, skip or change a medicine or a dose. Drafts for the copy owner.
chat.ask.failed=এই প্রশ্নের উত্তর এখন নিশ্চিত করে দিতে পারছি না। কাগজপত্রে কাগজে যা লেখা দেখুন, আর ওষুধ বা শরীরের কোনো সমস্যা নিয়ে ডাক্তারকে জিজ্ঞেস করুন।
chat.ask.limit=আজকের প্রশ্নের সীমা শেষ হয়েছে — কাল আবার জিজ্ঞেস করুন। ততক্ষণ কাগজপত্রে সব কাগজ আর মান দেখা যাবে।
chat.dose.ask_doctor=ওষুধ শুরু, বন্ধ, বাদ বা ডোজ বদলানোর সিদ্ধান্ত আমি দিতে পারি না — যিনি প্রেসক্রিপশন লিখেছেন, সেই ডাক্তারকে জিজ্ঞেস করুন।
# Plan CHAT-web (PO ruling P7, DR-50): the web composer asks. chat.ask.hint is the line under the field once JavaScript
