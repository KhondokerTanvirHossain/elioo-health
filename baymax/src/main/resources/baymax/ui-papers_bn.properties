# W2e-b: the month calendar (MonthCalendar): its legend, the day status a screen reader hears, and the week headed
# Saturday to Friday as the phone prototype heads it. Drafts for the copy owner (plan Q4).
calendar.legend.paper=কাগজ
calendar.legend.follow=ডাক্তারের দেওয়া তারিখ
calendar.legend.now=এখনই দেখার
calendar.day.status={0}: {1}, {2}
calendar.weekday.sat=শনি
calendar.weekday.sun=রবি
calendar.weekday.mon=সোম
calendar.weekday.tue=মঙ্গল
calendar.weekday.wed=বুধ
calendar.weekday.thu=বৃহঃ
calendar.weekday.fri=শুক্র
# W2e-b review: a day status that says the day's highest urgency in the same sentence (never joined outside the
# bundle), and the THIS_WEEK mark's word. Drafts for the copy owner (plan Q4).
calendar.legend.week=এ সপ্তাহে দেখার
calendar.day.status.now={0}: {1}, {2}, এখনই দেখার
calendar.day.status.week={0}: {1}, {2}, এ সপ্তাহে দেখার
# The word under a day's urgency mark in its cell, short enough for one seventh of a phone; the legend says it in full.
calendar.day.now=এখনই
calendar.day.week=এ সপ্তাহে
# DR-48: the day status counts in its own keys, one and other, as English needs; Bangla does not change the noun with
# the count, so both forms are the words the status said before. The status sentences above take them as {1} and {2}.
calendar.count.papers.one={0}টি কাগজ
calendar.count.papers.other={0}টি কাগজ
calendar.count.follows.one={0}টি ডাক্তারের তারিখ
calendar.count.follows.other={0}টি ডাক্তারের তারিখ
# W8: the papers page's doctor's dates (DueCard): the heading, the day a date is due, and the word beside the
# overdue shape. Drafts for the copy owner (plan W8).
due.title=ডাক্তারের দেওয়া তারিখ
due.date={0} তারিখে
due.overdue=তারিখ পেরিয়ে গেছে
