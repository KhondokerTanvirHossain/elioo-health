# English mirror of messages_bn.properties, for logs and review. Same keys, same placeholders.
document_type.prescription=Prescription
document_type.lab_report=Lab report
document_type.discharge_summary=Discharge summary
document_type.imaging_report=Imaging report
document_type.other=Report
explanation.routine=Received the report — {document_type}, {date}.\nEverything is within the normal range.\nFiled on {patient}'s timeline: {link}\nReply "detail" to hear more.
explanation.this_week=Received the report — {document_type}, {date}.\n{standout}\nSee a doctor within this week. Bring: this report and the previous prescriptions.\nTimeline: {link} · reply "detail" to hear more.
explanation.now=Received the report — {document_type}, {date}.\n{standout}\nGo to a doctor now. Do not delay.\nIf the patient is unconscious, struggling to breathe, or has chest pain — go straight to the nearest hospital emergency department.\nBring: this report and the previous prescriptions.
retake.second=That photo could not be read either — sorry.\nThree things that fix it: shoot by a window in daylight, lay the paper flat on a table, and hold the phone straight above it so the whole page is in frame.\nNo flash needed. Check the writing looks sharp on the phone before you take it.
# TODO(BMX-10): restore the human offer once "help" replies route to Tanvir's WhatsApp.
retake.third=This paper is hard to read from a photo — that is not your fault.\nIf you have any other report or prescription, send that — we can start there.\nKeep this one; another try later in daylight may well work.
retake=The photo is not clear enough to read.\nIn daylight, with the paper flat, please take the photo again and send it.\nWe would rather not guess — so we look at the photo first.
line.value_outside_range={value_name} came back {value} {unit}, normal range {ref_low}–{ref_high}.
line.value_critical_high={value_name} came back {value} {unit}, which is far above normal.
line.value_critical_low={value_name} came back {value} {unit}, which is far below normal.
line.this_week_no_value=There is something in this report a doctor should see.
urgency.now=Go to a doctor now. Do not delay.
urgency.this_week=See a doctor within this week.
detail.header={document_type}, {date} — detail:
detail.follow_up=Follow-up date the doctor gave: {date}.
detail.footer=Timeline: {link}

medicines.header=As written on the prescription:

nudge.follow_up_due={patient}’s follow-up date is close: {due_date}.\nThe prescription says: "{instruction}".\nIf you can, see the doctor that day; take the earlier reports and prescriptions along.
nudge.course_ending=One medicine on {patient}’s prescription reaches the end of its written course on {end_date}: {medicine} — {duration_text}.\nWhat comes next is for the doctor who wrote it to say.
nudge.medicine_changed={patient}’s new prescription ({date}) differs from the previous one in these medicines:\n{changes}\nWorth checking with the doctor that this was intended.
nudge.trend={patient}’s {marker} has been {direction} across the last {count} reports: {values} ({first_date} to {last_date}).\nSee a doctor this week. Take these reports along — they are together on the timeline.
nudge.silence=Nothing has come in for {patient} in {days} days (last one {last_date}). Everything all right?\nIf there is a new report or prescription, send a photo.
nudge.optout=Don't want messages like this? Click here: {optout_link}


# BMX-10 phase 1 mirror (English is for logs only; Bangla is what a family sees).
wa.received=Got the photo. Reading it now — this takes a moment.
wa.unknown=This number is not linked to a Medioo account yet.\nAsk whoever set up the account to add this number, then send it again.
wa.ambiguous=There is more than one person on this account, so I cannot tell whose report this is.\nI would rather not file it under the wrong person, so I have not saved it.\nFor now, open {link} and upload it there — you can choose whose report it is.
wa.free_tier=You have used all the free reports for this month.\nYou can send more next month — everything already sent stays on the timeline.
