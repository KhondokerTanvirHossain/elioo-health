explanation.routine=Received the report — {document_type}, {date}.\nEverything is within the normal range.\nFiled on {patient}'s timeline: {link}\nReply "detail" to hear more.
explanation.this_week=Received the report — {document_type}, {date}.\n{standout}\nSee a doctor within this week. Bring: this report and the previous prescriptions.\nTimeline: {link} · reply "detail" to hear more.
explanation.now=Received the report — {document_type}, {date}.\n{standout}\nGo to a doctor now. Do not delay.\nIf the patient is unconscious, struggling to breathe, or has chest pain — go straight to the nearest hospital emergency department.\nBring: this report and the previous prescriptions.
retake.second=That photo could not be read either — sorry.\nThree things that fix it: shoot by a window in daylight, lay the paper flat on a table, and hold the phone straight above it so the whole page is in frame.\nNo flash needed. Check the writing looks sharp on the phone before you take it.
retake.third=This paper is hard to read from a photo — that is not your fault.\nIf you like, keep the paper and we will arrange another way to read it later. Reply "help" and a person will talk to you.\nIf you have any other report or prescription, send that — we can start there.
retake=The photo is not clear enough to read.\nIn daylight, with the paper flat, please take the photo again and send it.\nWe would rather not guess — so we look at the photo first.
