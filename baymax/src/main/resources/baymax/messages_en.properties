line.value_critical_high={value_name} came back {value} {unit}, which is far above normal.
line.value_critical_low={value_name} came back {value} {unit}, which is far below normal.
line.this_week_no_value=There is something in this report a doctor should see.
urgency.now=Go to a doctor now. Do not delay.
urgency.this_week=See a doctor within this week.
