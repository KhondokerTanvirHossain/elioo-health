# Baymax family-facing copy (BMX-6). Bangla. Edit freely: nothing here is read by code except the keys and the
# {placeholders}. Tanvir's wife owns the wording; these are the PO's first drafts, shipped so there is something
# to react to. messages_en.properties mirrors every key for logs.
#
# Baymax never states what a result means clinically, never names a disease from a number, and never mentions
# medicines or doses in these messages. Urgency wording is fixed by code (urgency.*); the model may not change it.
#
# Placeholders: {document_type} {date} {patient} {link} {value_name} {value} {unit} {ref_low} {ref_high}
# Lines are joined with \n. Every message is capped at 600 characters after substitution.

document_type.prescription=প্রেসক্রিপশন
document_type.lab_report=ল্যাব রিপোর্ট
document_type.discharge_summary=ডিসচার্জ সামারি
document_type.imaging_report=ইমেজিং রিপোর্ট
document_type.other=রিপোর্ট

# DR-26: the doctor's own diagnosis lines, verbatim, never explained or paraphrased
diagnosis.header=ডাক্তার লিখেছেন:

# A. ROUTINE — two forms. "within the normal range" is a CLAIM ABOUT THE DOCUMENT and may only be made when
# the document actually carries values with printed ranges and every value is INSIDE by code (D35): the value
# and both bounds parse, and low <= value <= high. A prescription has
# no printed ranges, so the claim is ungrounded there: on 2026-09-21 it was sent for a prescription recording
# near-blackout, hallucinations and a new Parkinson's diagnosis. explanation.routine.filed says only what is
# true of every document — that it is filed and can be read back.
explanation.routine=রিপোর্টটি পেয়েছি — {document_type}, {date}।\nসব কিছু স্বাভাবিক সীমার মধ্যে আছে।\n{patient}-এর টাইমলাইনে রেখে দিলাম: {link}\nবিস্তারিত জানতে চাইলে লিখুন "বিস্তারিত"।
explanation.routine.filed=রিপোর্টটি পেয়েছি — {document_type}, {date}।\n{patient}-এর টাইমলাইনে রেখে দিলাম: {link}\nকাগজে যা লেখা আছে নিচে তুলে দিলাম।\nবিস্তারিত জানতে চাইলে লিখুন "বিস্তারিত"।

# B. THIS_WEEK — {standout} is one or more line.value_outside_range lines
explanation.this_week=রিপোর্টটি পেয়েছি — {document_type}, {date}।\n{standout}\nএ সপ্তাহের মধ্যে একজন ডাক্তার দেখান। সাথে নিয়ে যাবেন: এই রিপোর্ট এবং আগের প্রেসক্রিপশনগুলো।\nটাইমলাইন: {link} · বিস্তারিত জানতে লিখুন "বিস্তারিত"।

# C. NOW — {standout} is one or more line.value_critical lines
explanation.now=রিপোর্টটি পেয়েছি — {document_type}, {date}।\n{standout}\nএখনই ডাক্তারের কাছে যান। দেরি করবেন না।\nরোগী যদি অজ্ঞান হন, শ্বাস নিতে কষ্ট হয়, বা বুকে ব্যথা হয় — সরাসরি নিকটস্থ হাসপাতালের জরুরি বিভাগে যান।\nসাথে নিয়ে যাবেন: এই রিপোর্ট এবং আগের প্রেসক্রিপশনগুলো।

# D. NEEDS_RETAKE — first time
retake=ছবিটা স্পষ্ট বোঝা যাচ্ছে না।\nদিনের আলোয়, কাগজটা সমান করে রেখে আরেকবার ছবি তুলে পাঠান।\nঅনুমান করে কিছু বলতে চাই না — তাই আগে ছবিটা দেখে নিই।

# D2. second consecutive NEEDS_RETAKE for the same family — more specific: the three things that actually fix it
retake.second=এবারও ছবিটা পড়া গেল না — দুঃখিত।\nতিনটা জিনিস চেষ্টা করুন: জানালার পাশে দিনের আলোয় তুলুন, কাগজটা টেবিলে সমান করে রাখুন, আর ফোনটা ঠিক উপর থেকে ধরুন যেন পুরো পাতা ফ্রেমে থাকে।\nফ্ল্যাশ লাগবে না। ছবি তোলার আগে লেখাগুলো ফোনে পরিষ্কার দেখা যাচ্ছে কি না দেখে নিন।

# D3. third consecutive — offer only what exists: a different document, or another try later in better light.
# TODO(BMX-10): restore the human offer ("লিখুন সাহায্য, একজন মানুষ কথা বলবে") once the reply routes to Tanvir's WhatsApp.
# Until then a family in difficulty would be replying into silence, which is worse than no offer (PO, 2026-09-18).
retake.third=এই কাগজটা ছবিতে পড়া কঠিন হচ্ছে — এটা আপনার দোষ নয়।\nঅন্য কোনো রিপোর্ট বা প্রেসক্রিপশন থাকলে সেটা পাঠান — সেটা দিয়েই শুরু করি।\nএই কাগজটা রেখে দিন; পরে দিনের আলোয় আরেকবার চেষ্টা করলে হয়ে যেতে পারে।

# Standout lines, one per value
line.value_outside_range={value_name} এসেছে {value} {unit}, স্বাভাবিক সীমা {ref_low}–{ref_high}।
line.value_critical_high={value_name} এসেছে {value} {unit}, যা স্বাভাবিকের চেয়ে অনেক বেশি।
line.value_critical_low={value_name} এসেছে {value} {unit}, যা স্বাভাবিকের চেয়ে অনেক কম।
line.this_week_no_value=এই রিপোর্টে এমন কিছু আছে যা একজন ডাক্তারকে দেখানো দরকার।

# Urgency lines — fixed by code; a message at this urgency must contain its line verbatim
urgency.now=এখনই ডাক্তারের কাছে যান। দেরি করবেন না।
urgency.this_week=এ সপ্তাহের মধ্যে একজন ডাক্তার দেখান।

# Detail (on request): the same facts, one line per value and per follow-up date, still capped
detail.header={document_type}, {date} — বিস্তারিত:
detail.follow_up=ডাক্তারের দেওয়া ফলো-আপ তারিখ: {date}।
detail.footer=টাইমলাইন: {link}

# DR-16: the verbatim medicine block, appended after generation; the model never sees it
medicines.header=প্রেসক্রিপশনে যা লেখা আছে:

# E. Nudges (BMX-8): what changed with the extraction's own strings, why it is mentioned, what to do (doctor-first).
# Never a cause, never a condition name, never a medicine instruction. Every nudge ends with nudge.optout.
nudge.follow_up_due={patient}-এর ফলো-আপের তারিখ কাছে এসে গেছে: {due_date}।\nপ্রেসক্রিপশনে লেখা: "{instruction}"।\nসম্ভব হলে সেই দিন ডাক্তার দেখিয়ে নিন; সাথে নিয়ে যাবেন আগের রিপোর্ট ও প্রেসক্রিপশনগুলো।
nudge.course_ending={patient}-এর প্রেসক্রিপশনে লেখা একটি ওষুধের মেয়াদ {end_date} শেষ হচ্ছে: {medicine} — {duration_text}।\nএরপর কী করবেন, তা প্রেসক্রিপশন যিনি দিয়েছেন সেই ডাক্তারই বলতে পারবেন।
nudge.medicine_changed={patient}-এর নতুন প্রেসক্রিপশনে ({date}) আগেরটার তুলনায় ওষুধে পরিবর্তন দেখা যাচ্ছে:\n{changes}\nএটা ইচ্ছাকৃত কি না, ডাক্তারের কাছে একবার জেনে নিন।
nudge.trend={patient}-এর {marker} গত {count}টি রিপোর্টে {direction} — {values} ({first_date} থেকে {last_date})।\nএ সপ্তাহের মধ্যে একজন ডাক্তার দেখান। সাথে নিয়ে যাবেন এই রিপোর্টগুলো — আমি টাইমলাইনে একসাথে রেখেছি।
nudge.silence={patient}-এর কোনো কাগজ আসেনি {days} দিন হলো (শেষ নথি {last_date})। সব ঠিক আছে তো?\nনতুন কোনো রিপোর্ট বা প্রেসক্রিপশন থাকলে ছবি তুলে পাঠান।
nudge.optout=এই ধরনের বার্তা আর চান না? এখানে ক্লিক করুন: {optout_link}


# BMX-10 phase 1: replies the WhatsApp channel sends before a document exists.
# wa.received  — acknowledgement the moment a photo arrives, so nothing vanishes in silence
# wa.unknown   — the sender has no family account; a stub, not an onboarding flow (phase 1)
# wa.ambiguous — the family has more than one patient and phase 1 cannot ask "Ma or Baba?" yet (§1.4)
wa.received=ছবিটা পেয়েছি। পড়ে দেখছি — একটু সময় লাগবে।
wa.unknown=এই নম্বরটা এখনো Medioo-তে যুক্ত করা হয়নি।\nযিনি অ্যাকাউন্ট খুলেছেন তাঁকে বলুন এই নম্বরটা যোগ করে দিতে, তারপর আবার পাঠান।
wa.ambiguous=এই অ্যাকাউন্টে একাধিক জনের নাম আছে, তাই রিপোর্টটা কার সেটা আমি নিশ্চিত হতে পারছি না।\nভুল জনের নামে রাখতে চাই না — তাই আপাতত রাখলাম না।\nএখন {link} এই ঠিকানায় গিয়ে ছবিটা পাঠালে কার রিপোর্ট সেটা বেছে দিতে পারবেন।
wa.free_tier=এই মাসে বিনামূল্যের সব কটা রিপোর্ট পাঠানো হয়ে গেছে।\nপরের মাসে আবার পাঠাতে পারবেন — আগের সব রিপোর্ট টাইমলাইনে থেকে যাবে।
wa.no_document=এখনো কোনো রিপোর্ট পড়া যায়নি, তাই বিস্তারিত বলার মতো কিছু নেই।\nএকটা রিপোর্ট বা প্রেসক্রিপশনের ছবি পাঠান।

# Phase 0. Drafts for the copy owner; safety.red_flag_line is the approved sentence from explanation.now, word for word.
safety.red_flag_line=রোগী যদি অজ্ঞান হন, শ্বাস নিতে কষ্ট হয়, বা বুকে ব্যথা হয় — সরাসরি নিকটস্থ হাসপাতালের জরুরি বিভাগে যান।
# F4: answers to "বিস্তারিত" that are NOT the explanation body. WaIntakeService never sends a body itself; the body
# goes through the delivery port. Code puts the UrgencyLines block first when the document is urgent (D5).
wa.detail.pending=নতুন রিপোর্টটা পড়া হয়েছে। Medioo-র ব্যাখ্যাটা একজন মিলিয়ে দেখছেন।
wa.detail.unavailable=এই কাগজের লেখা ব্যাখ্যা দেওয়া হবে না। কাগজে যা লেখা আছে, ছবিসহ এখানে: {link}\nপ্রশ্ন থাকলে ডাক্তারকে দেখান।
wa.detail.already_sent=বিস্তারিত আগেই পাঠানো হয়েছে — উপরের বার্তায় আছে। কাগজে যা লেখা আছে, ছবিসহ: {link}

# Phase 0 PR 6 — drafts for the copy owner. Every WhatsApp message gets exactly one reply (spec §6 W1, W8, W11, W12,
# W23). Code appends safety.red_flag_line to wa.thanks, wa.fallback, wa.voice and wa.video (and to the sticker and
# reaction reply, which is wa.thanks) until D11's emergency template ships. wa.greeting.* mirror the family's greeting
# and never assume religion: সালাম is answered with সালাম only when the family said it (spec §7.4).
wa.greeting.hello=হ্যালো!
wa.greeting.salam=ওয়ালাইকুম আসসালাম।
wa.greeting.namaskar=নমস্কার।
wa.greeting.adab=আদাব।
wa.greeting.intro=আমি Medioo — পরিবারের চিকিৎসার কাগজপত্র গুছিয়ে রাখি, আর কাগজে কী লেখা আছে তা সহজ বাংলায় বুঝিয়ে বলি। আমি ডাক্তার নই।
wa.greeting.none=রিপোর্ট বা প্রেসক্রিপশনের ছবি পাঠান — পড়ে বুঝিয়ে বলব।
wa.thanks=ঠিক আছে। নতুন কোনো রিপোর্ট বা প্রেসক্রিপশন এলে ছবি তুলে পাঠাবেন।
# wa.fallback quotes "বিস্তারিত" so CopyInstructionsHaveHandlersTest sees the invitation and asserts it reaches DETAIL.
# Under D4 it also answers medicine and symptom messages, so it points to a doctor first (W23: a polite scoped decline).
wa.fallback=দুঃখিত, এই বার্তার উত্তর আমি এখনো দিতে পারি না। ওষুধ বা শরীরের কোনো সমস্যা নিয়ে প্রশ্ন থাকলে ডাক্তারকে জিজ্ঞেস করুন।\nরিপোর্ট বা প্রেসক্রিপশনের ছবি পাঠাতে পারেন, বা শেষ কাগজের ব্যাখ্যা পেতে লিখুন "বিস্তারিত"।
wa.voice=ভয়েস মেসেজ এখনো শুনতে পারি না — লিখে পাঠাবেন, বা কাগজের ছবি দিন।
wa.video=ভিডিও এখনো দেখতে পারি না — লিখে পাঠাবেন, বা কাগজের একটা ছবি তুলে দিন।
wa.unsupported_file=এই ধরনের ফাইল এখনো খুলতে পারি না। কাগজের ছবি বা PDF পাঠান।
wa.received.file=ফাইলটা পেয়েছি। পড়ে দেখছি — একটু সময় লাগবে।

# DR-39 (sign-in is free): the sign-in code, sent over WhatsApp as a free-form message, never a template.
wa.login_code=Medioo-তে ঢোকার কোড: {code}\nকোডটা {minutes} মিনিট চলবে।\nএই কোড কাউকে দেবেন না। Medioo কখনো ফোন করে কোড চায় না।

# D2 / DR-39: answers to "কোড" on WhatsApp other than the code itself (which is wa.login_code, sent by the OTP delivery).
wa.login_rate_limited=অল্প সময়ে অনেকবার কোড চাওয়া হয়েছে। শেষ যে কোডটা এসেছে সেটা দিয়েই ঢুকুন, বা {minutes} মিনিট পরে আবার "কোড" লিখুন।
wa.login_no_account=এই নম্বরে এখনো Medioo খোলা হয়নি।\nযিনি অ্যাকাউন্ট খুলেছেন তাঁকে বলুন এই নম্বরটা যোগ করে দিতে।
wa.login_off=এই মুহূর্তে লগইন চালু নেই। একটু পরে আবার "কোড" লিখুন।
