# ui-chat: the chat tab, attention stack, composer; owned by C4.
# A5: the placeholder until C4 (drafts for the copy owner)
chat.hello=Hello, {0}.
chat.hello.plain=Hello.
chat.papers=See {0} papers
chat.soon=Asking questions is coming soon. Until then, see every paper and value under Papers.
# C3: the empty papers tab's camera link (s16); C4's empty chat uses it too. Draft for the copy owner.
chat.empty.action=Take a photo
# C4: the attention stack (s06, spec §4.6), the strip on Papers, the empty chat and the composer. Drafts for the copy owner.
attn.heading=What to look at now in {0} papers
attn.strip=Needs attention now
attn.open=Open the paper
attn.retake.title=I could not read this paper clearly — I will not guess.
attn.follow.title=Date the doctor wrote: {0}
attn.reading.title=Reading a paper
attn.reading.action=See how far it is
chat.intro=I am Medioo — not a doctor. I keep medical papers in order and show what is written on them in plain words.
chat.camera=Send a photo of a paper
# W5 (plan Wave 3, S8): the web composer. chat.field is the field's label (the prototype's placeholder); chat.ask.reply
# is what Medioo answers to a typed question until D11, as wa.fallback says it, and code appends safety.red_flag_line
# to it (home/chat-words.ts), as WhatsApp appends it to wa.fallback. Drafts for the copy owner.
chat.field=Write to Medioo
chat.ask.reply=I cannot answer questions yet. If you have a question about a medicine or a health problem, ask a doctor.
# Plan CHAT-api (PO ruling P7, DR-50): the web chat answers. chat.ask.failed replaces a model answer that failed the code
# checks twice or did not arrive; chat.ask.limit is the day's question cap; code appends chat.dose.ask_doctor to every
# answer to a question that asks to start, stop, skip or change a medicine or a dose. Drafts for the copy owner.
chat.ask.failed=I can't give a reliable answer to this right now. See what the papers say under Papers, and ask a doctor about a medicine or a health problem.
chat.ask.limit=That's all the questions for today — please ask again tomorrow. Your papers and values are still under Papers.
chat.dose.ask_doctor=I can't decide whether to start, stop, skip or change a medicine or its dose — ask the doctor who wrote the prescription.
# Plan CHATCOPY (#170): the shape the chat prompt shows the model for an answer to a question that asks to change a
# medicine (ChatPrompt.doseAnswer). {0} is the patient's possessive, built in code (NameGrammar.possessiveIn: Ma's,
# Chris'); {1} is a prescription line's token. Draft for the copy owner.
chat.dose.example={0} latest prescription says: {1}
# PO ruling P14 ("Only what the papers say"): a question about what a medicine is for, does or treats is answered by code,
# with no model call (MedicinePurposeReply). chat.purpose.written is followed by the medicine's stored line(s), one per
# line; chat.purpose.unmatched by every stored line when the question names a word no stored line holds (code never says
# a medicine is not on the prescription: the word may be a stored name typed otherwise, review of #171, finding 6);
# chat.purpose.unshown when the medicine asked about is on the paper but its line is never shown (an abbreviated line,
# DR-16); chat.purpose.none when Medioo keeps no medicine line from the latest prescription; chat.purpose.more when the
# lines do not all fit. {0} is the patient's possessive, built in code (NameGrammar.possessiveIn). Code appends
# chat.purpose.ask after every answer to such a question, the model's included. Drafts for the copy owner.
chat.purpose.written={0} latest prescription says:
chat.purpose.unmatched=I could not match that name; {0} latest prescription says:
chat.purpose.unshown=This medicine's line is on {0} latest prescription but cannot be shown here: see the photo of the prescription under Papers.
chat.purpose.none=No medicine line from {0} latest prescription is kept here.
chat.purpose.more=See the other medicines on the prescription under Papers.
chat.purpose.ask=Ask the doctor or a pharmacist what the medicine is for — I only say what is written on the papers.
# Plan CHAT-web (PO ruling P7, DR-50): the web composer asks. chat.ask.hint is the line under the field once JavaScript
# runs; chat.ask.nojs is that line without JavaScript, where there is no field; chat.ask.pending is the bubble while Java
# answers. chat.soon stays: Java's ChatView still shows it. Drafts for the copy owner.
chat.ask.hint=Medioo answers only from what your papers say. I am not a doctor.
chat.ask.nojs=To ask a question, turn on JavaScript for this page. All papers and values are under Papers.
chat.ask.pending=Medioo is looking at {0} papers…
