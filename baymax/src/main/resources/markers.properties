# Canonical markers and the spellings that map onto them
# =======================================================
#
# Config, not code: edit freely, no release needed. Two things depend on this table.
#
# 1. Trend detection needs a stable key across labs that spell the same test five different ways.
# 2. PER-MARKER URGENCY THRESHOLDS ARE JOINED TO A READING THROUGH THIS TABLE. A marker with a threshold in
#    marker-thresholds.properties but no entry here CANNOT BE CANONICALISED, so its threshold can never fire.
#    A signed-off threshold that cannot fire is worse than no threshold at all, because it looks fixed.
#    EveryThresholdIsReachableTest derives its expectation from the threshold table and fails the build if
#    the two drift apart — so a threshold added without an alias is caught here, not in production.
#
# Matching (MarkerMatcher): lower-cased, punctuation to spaces, whitespace collapsed, then an exact lookup,
# then a LONGEST-substring fallback. The fallback is why "S-POTASSIUM" finds "potassium" without listing it,
# and why aliases must be chosen carefully: a short alias can swallow an unrelated test name. "Non-HDL
# Cholesterol" must not become "hdl", whose direction is inverted; MPV must not become "platelet".
#
# Aliases below are the spellings actually seen on batch 2 — real Bangladeshi, Nigerian, UAE, Nepali and
# vendor-template reports — not invented variants.

# --- Already tracked before the threshold work ---
baymax.markers[0].canonical=hba1c
baymax.markers[0].aliases=hba1c,hb a1c,glycated haemoglobin,glycosylated hemoglobin,a1c,hbaic
baymax.markers[1].canonical=fasting_glucose
baymax.markers[1].aliases=fasting glucose,fbs,fasting blood sugar,glucose fasting,blood sugar (fasting),sugar fasting,blood sugar fasting,fasting plasma glucose,fbg
baymax.markers[1].not-aliases=urine,corresponding
baymax.markers[2].canonical=creatinine
baymax.markers[2].aliases=creatinine,s. creatinine,serum creatinine,s creatinine,creat
baymax.markers[3].canonical=bp_systolic
baymax.markers[3].aliases=systolic,bp systolic,systolic bp,sbp
baymax.markers[4].canonical=bp_diastolic
baymax.markers[4].aliases=diastolic,bp diastolic,diastolic bp,dbp
baymax.markers[5].canonical=ldl
baymax.markers[5].aliases=ldl,ldl cholesterol,ldl-c,low density lipoprotein
baymax.markers[6].canonical=tsh
baymax.markers[6].aliases=tsh,thyroid stimulating hormone,s. tsh,serum tsh

# --- Electrolytes ---
# potassium is the row that corrects batch 2's known UNDER-escalation (lab7, 6.4 mmol/L). Before this entry
# existed, "S-POTASSIUM" did not canonicalise and that threshold could never have fired.
baymax.markers[7].canonical=potassium
# "k+" normalises to "k": a single letter matches almost anything. The spelled-out forms are enough.
baymax.markers[7].aliases=potassium,s-potassium,s potassium,serum potassium,potassium (k+)
baymax.markers[8].canonical=sodium
# "na+" normalises to "na", short enough to appear inside unrelated words; the spelled-out aliases cover
# every name batch 2 actually printed.
baymax.markers[8].aliases=sodium,s-sodium,s sodium,serum sodium,sodium (na+),serum sodium level
baymax.markers[9].canonical=chloride
# NO bare "cl-" alias: it normalises to "cl", which the substring fallback finds inside "atherosCLerosis
# index". A two-character alias is not a marker name, it is a trap.
baymax.markers[9].aliases=chloride,s-chloride,s chloride,serum chloride
baymax.markers[10].canonical=bicarbonate
baymax.markers[10].aliases=bicarbonate,s-tot. co2 (bicarbonate),total co2,tco2,hco3

# --- Haematology ---
baymax.markers[11].canonical=haemoglobin
# "hb" would match inside "HbA1c" and any name containing those letters; HbA1c is its own marker above.
baymax.markers[11].aliases=haemoglobin,hemoglobin,hgb,haemoglobin (hb),hb%
baymax.markers[12].canonical=platelet
baymax.markers[12].aliases=platelet,platelets,platelet count,platelets total count,platelet total count,plt
# MPV is a platelet SIZE index, not a count: judged against a platelet-count threshold it would read as a
# catastrophically low platelet count on every normal report.
baymax.markers[12].not-aliases=mean platelet volume,mpv,platelet distribution,pdw
# "total leucocyte count" and "TLC" are the common BD spellings; "pus cells/WBC" is a URINE finding and must
# not land here, which is why no bare "wbc" alias is listed — the substring fallback would catch it.
baymax.markers[13].canonical=wbc
baymax.markers[13].aliases=wbc total count,total wbc count,total leucocyte count,total leukocyte count,tlc,white blood cell count,wbc count
# "Pus cells/WBC" and "WBC Cast" are URINE findings counted per high-power field, not a blood count.
baymax.markers[13].not-aliases=pus,cast,urine,/hpf
baymax.markers[14].canonical=neutrophil_absolute
# NO bare "anc" alias: it appears inside "appeARANCe", a urine finding, which then resolved to an absolute
# neutrophil count. Three letters is not a marker name.
baymax.markers[14].aliases=absolute neutrophil count,neutrophil absolute count,abs neutrophil count
baymax.markers[15].canonical=esr
baymax.markers[15].aliases=esr,erythrocyte sedimentation rate,e.s.r

# --- Liver ---
baymax.markers[16].canonical=alt
baymax.markers[16].aliases=alt,sgpt,alt (sgpt),sgpt/alt,s.alt ( sgpt ),s-alt (gpt),alanine aminotransferase,serum alt
baymax.markers[17].canonical=ast
baymax.markers[17].aliases=ast,sgot,ast (sgot),s.ast (sgot),aspartate aminotransferase,serum ast
# URINE MICROSCOPY. "Granular Cast", "Hyaline Cast", "RBC Cast", "WBC Cast" all contain the letters of AST
# ("c-AST"), and every one of them resolved to the liver enzyme. A cast count judged against an ALT/AST
# threshold is a wrong urgency on a urine report. Found by scripts/alias_coverage.py, not by inspection.
baymax.markers[17].not-aliases=cast,casts
baymax.markers[18].canonical=alp
baymax.markers[18].aliases=alkaline phosphatase,s-alkaline phosphatase,s. alkaline phosphatase,serum alkaline phosphatase,alk phos
# TOTAL bilirubin only. Conjugated and unconjugated fractions are different quantities and get no threshold;
# they must not be swallowed by this entry, so no bare "bilirubin" alias is listed.
baymax.markers[19].canonical=bilirubin_total
# NEVER put a comma inside an alias: Spring splits this list on commas, so "bilirubin, total" became two
# aliases — one of them the bare word "total", which matched "RBC TOTAL count", "Platelets TOTAL count" and
# every other name containing it. The page's own "BILIRUBIN, TOTAL" is handled by normalisation, which turns
# punctuation into spaces, so "bilirubin total" already covers it.
baymax.markers[19].aliases=bilirubin total,total bilirubin,s-bilirubin,total serum bilirubin
baymax.markers[19].not-aliases=conjugated,unconjugated,direct,indirect

# --- Kidney ---
baymax.markers[20].canonical=urea
baymax.markers[20].aliases=urea,s-urea,blood urea,serum urea,bun,blood urea nitrogen
baymax.markers[21].canonical=egfr
baymax.markers[21].aliases=egfr,e-gfr,estimated gfr,gfr,egfr-(ckd-epi),egfr (ckd-epi)
baymax.markers[22].canonical=uric_acid
baymax.markers[22].aliases=uric acid,s-uric acid,serum uric acid,urate (serum)

# --- Lipids (every one never_escalates in the threshold table: the signal is the trend, DR-17) ---
baymax.markers[23].canonical=total_cholesterol
baymax.markers[23].aliases=total cholesterol,cholesterol (total),cholesterol total,s. total cholesterol,serum total cholesterol
# HIGH IS GOOD. "Non-HDL cholesterol" is a different quantity and must never land here, or a healthy reading
# would be read against an inverted direction.
baymax.markers[24].canonical=hdl
baymax.markers[24].aliases=hdl,hdl cholesterol,hdl-cholesterol,s. hdl cholesterol,high density lipoprotein
# THE DANGEROUS ONE. "Non-HDL Cholesterol" contains "hdl" and resolved to it. HDL's threshold is
# direction-inverted (high is protective), so a HIGH non-HDL — which is bad — would have been read as a
# healthy HDL and never escalated.
baymax.markers[24].not-aliases=non-hdl,non hdl,nonhdl
baymax.markers[25].canonical=triglyceride
# no bare "tg": two letters, and it appears inside other words.
baymax.markers[25].aliases=triglyceride,triglycerides,serum triglyceride,triglyceride cholesterol,serum triglyceride cholesterol

# --- Other ---
baymax.markers[26].canonical=random_glucose
baymax.markers[26].aliases=random plasma glucose,random blood sugar,rbs,random glucose,blood sugar (random)
# A urine sugar is a dipstick finding, not a plasma glucose, and carries no plasma threshold.
baymax.markers[26].not-aliases=urine
baymax.markers[27].canonical=specific_gravity
baymax.markers[27].aliases=specific gravity,sp. gravity,sp gravity,urine specific gravity
baymax.markers[28].canonical=calcium
baymax.markers[28].aliases=calcium,s-calcium,serum calcium,total calcium,corrected calcium
# "Calcium-Oxalate" is a urine CRYSTAL, not serum calcium: a crystal count has no mg/dL threshold.
baymax.markers[28].not-aliases=oxalate,crystal,urine
