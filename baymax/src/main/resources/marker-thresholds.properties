# Per-marker urgency thresholds — PROPOSED, INERT, AWAITING CLINICAL SIGN-OFF
# =============================================================================
#
# EVERY ENTRY HERE IS status=proposed AND CHANGES NOTHING. The live rule is still the 2x/0.5x stopgap in
# baymax.outbound.critical-high-multiple / critical-low-multiple. Only status=active can alter a family's
# message, and ProposedThresholdsAreInertTest asserts that a proposed entry which WOULD change a verdict
# does not.
#
# Sign-off is meant to be a config change, not a code change: a doctor approves a row, someone flips that
# row's status to active, and the rule takes effect. Nothing else moves.
#
# WHY THESE NUMBERS EXIST
# Batch 2 showed the stopgap is wrong in BOTH directions. It escalated ESR 29, a dilute urine sample, mild
# liver enzymes and a borderline lipid panel; it left potassium 6.4 at THIS_WEEK when published critical
# lists put it at same-day. No single multiplier can be right for both ESR and potassium.
#
# SOURCES (as supplied for review): RCPath critical-value list, Leuven 2024 consensus, Mayo Clinic
# Laboratories, ARUP, UK Kidney Association, SVIMS India. Each row records its own source; the doctor
# reviews the citation as well as the number.
#
# UNITS ARE PART OF THE KEY AND ARE NEVER CONVERTED. Creatinine 65 umol/L is normal; creatinine 65 mg/dL is
# not compatible with life. A value whose unit does not match a row falls back to the stopgap and says so in
# urgency_reasons. A marker reported in a unit not listed here therefore needs its OWN row, not a conversion.
#
# COLUMNS
#   canonical-name    the marker as MarkerMatcher canonicalises it
#   unit              the unit these numbers are stated in
#   now-low/now-high  at or beyond this -> GO NOW
#   week-low/week-high at or beyond this -> THIS WEEK
#   never-escalates   this marker alone never raises urgency (chronic risk markers: signal is the trend)
#   direction         NORMAL | HIGH_IS_GOOD (HDL) | LOW_IS_BAD (eGFR)
#   symptom-gated     tier applies only if the patient is currently unwell — INERT, no symptom question exists
#   status            proposed | active   <-- the sign-off switch
#   source            the citation a clinician is being asked to approve

# --- Potassium: the batch-2 under-escalation. 6.4 is a same-day result on most published lists. ---
baymax.outbound.marker-thresholds[0].canonical-name=potassium
baymax.outbound.marker-thresholds[0].unit=mmol/L
baymax.outbound.marker-thresholds[0].now-low=2.5
baymax.outbound.marker-thresholds[0].now-high=6.0
baymax.outbound.marker-thresholds[0].week-low=3.0
baymax.outbound.marker-thresholds[0].week-high=5.5
baymax.outbound.marker-thresholds[0].direction=NORMAL
baymax.outbound.marker-thresholds[0].status=proposed
baymax.outbound.marker-thresholds[0].source=RCPath / Leuven 2024 (proposed)

