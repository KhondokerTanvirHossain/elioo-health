# DR-50 (PO ruling P7, 2026-10-30): the চ্যাট's emergency pre-check, the D11 red-flag categories as rows, not code.
# Read by RedFlagMatcher. A question that matches any ACTIVE phrase gets the emergency lines at once, before any model call,
# outside the daily cap, and also when answers are switched off. A row with status=proposed never fires.
#
# Format, per category:
#   <category>.status=active|proposed
#   <category>.source=<who approved the row, and when>
#   <category>.<script>.<n>=<phrase>      script is bn (Bangla script), banglish (Bangla in Latin letters) or en (English)
# Each phrase is normalised exactly as the question is (TextNormaliser) and matched from the start of a word, so an
# inflected form ("শ্বাসকষ্টে", "খিঁচুনিতে", "seizures") still fires. A single Latin word of four letters or fewer ("fits",
# "hypo") fires only as a whole word, so "hypothyroid" does not ("benefits" never could: matching starts at a word).
# A NEAR row joins parts with " + " ("বুক + ব্যথা"): it fires when every part, each matched as a phrase is, starts within
# eight words of the others, in any order, so "বুকে খুব ব্যথা হচ্ছে" and "pain in my chest" fire. In a part, the word
# "anynumber" stands for any number ("took anynumber tablet" fires on "took 10 tablets").
#
# No clinician has reviewed these rows (DR-50 waives the D11 gate); a later review edits rows here, not code. Add phrases
# freely: ShippedChatRedFlagsTest and RedFlagMatcherTest walk every row, and ShippedChatRedFlagsTest also replays
# src/test/resources/chat/red-flag-corpus.tsv, sentences written from how families phrase an emergency, so a phrase this
# file lacks fails a named row there. Never remove one without the PO. The document emergency words
# (baymax.outbound.emergency-phrases) are not used by the chat: "is this report urgent?" is not an emergency.

