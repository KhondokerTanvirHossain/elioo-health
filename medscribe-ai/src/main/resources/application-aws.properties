# AWS Configuration for MedScribe AI
# This profile contains AWS-specific settings for production deployment

# AWS Region
aws.region=us-east-1

# AWS Credentials (Optional - uses IAM roles if not specified)
# For local development, you can set these or use AWS CLI configuration (~/.aws/credentials)
# For production, use IAM roles attached to EC2/ECS/Lambda
aws.access-key-id=
aws.secret-access-key=

# Amazon Bedrock Configuration
# Note: Use cross-region inference profile ARN instead of direct model ID
# Format: arn:aws:bedrock:{region}::foundation-model/{model-id}
# For cross-region inference (recommended): us.anthropic.claude-3-5-sonnet-20241022-v2:0
#aws.bedrock.model-id=anthropic.claude-sonnet-4-5-20250929-v1:0
aws.bedrock.model-id=us.anthropic.claude-3-5-sonnet-20241022-v2:0
aws.bedrock.max-tokens=4096
aws.bedrock.temperature=0.7
aws.bedrock.timeout-seconds=300

# Bedrock Health API Configuration
aws.bedrock.health.enabled=true
aws.bedrock.health.default-audience=PATIENT
aws.bedrock.health.cache.enabled=true
aws.bedrock.health.cache.ttl-seconds=3600
aws.bedrock.health.cache.max-entries=1000

# S3 Configuration for Document Storage
aws.s3.bucket-name=medscribe-ai-documents
aws.s3.document-prefix=medical-reports/
aws.s3.presigned-url-expiration-minutes=60

# Textract Configuration
aws.textract.max-concurrent-jobs=10
aws.textract.job-timeout-minutes=30

# Comprehend Medical Configuration
aws.comprehendmedical.max-text-length=20000
aws.comprehendmedical.min-confidence-threshold=0.30
# Maximum number of codes to return per medical concept (sorted by confidence)
# Set to 0 for unlimited
aws.comprehendmedical.max-codes-per-concept=50
# Maximum number of entities to return from classification (sorted by confidence)
# Set to 0 for unlimited
aws.comprehendmedical.max-entities=0

# AWS Service Retry Configuration
aws.retry.max-attempts=3
aws.retry.backoff-base-delay-ms=100

# Logging
logging.level.software.amazon.awssdk=DEBUG
logging.level.com.elioo.healthcare.medicalreport.adapter.out.aws=info
