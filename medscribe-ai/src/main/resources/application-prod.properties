server.port=8086

# GCP Configuration
# Credentials are loaded via GOOGLE_APPLICATION_CREDENTIALS environment variable
# which points to the volume-mounted credentials file at /secrets/gcp-credentials.json
gcp.enabled=true
gcp.project-id=<YOUR_GCP_PROJECT>
# No gcp.credentials-path needed - will use Application Default Credentials from GOOGLE_APPLICATION_CREDENTIALS env var

feature-flagging.base-url=${FEATURE_FLAGGING_SERVICE_URL}

# Reactive PostgreSQL connection
spring.r2dbc.url=r2dbc:postgresql://${PGHOST:localhost}:5432/medscribe?schema=medscribe
spring.r2dbc.username=${PGUSER:postgres}
spring.r2dbc.password=${PGPASSWORD:changeme}


# URL of your admin server (use the service name if in EKS, or the correct DNS/host)
spring.boot.admin.client.url=${SPRING_ADMIN_SERVER_URL}

spring.boot.admin.client.instance.service-base-url=${MEDSCRIBEAI_SERVICE_URL}

# If you enabled security on the admin server, set credentials:
spring.boot.admin.client.username=${ADMIN_SERVER_USERNAME}
spring.boot.admin.client.password=${ADMIN_SERVER_PASS}
