spring.application.name=medscribe-ai
# Profile is set via SPRING_PROFILES_ACTIVE environment variable
# For local dev, uncomment and set to: local2,aws,gcp
# For production: prod,aws,gcp (set via environment variable)
spring.profiles.active=local2,aws,gcp

# WebFlux Configuration - Increase buffer size for large base64 images
spring.codec.max-in-memory-size=10MB

#micrometer tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

#log and logback
LOG_DIR=/tmp/logs
MAX_FILE_SIZE=15MB
MAX_HISTORY=20
LOG_LEVEL_ROOT=INFO

# OCR provider: gcp (Google Vision, default; Bangla + English) or aws (Textract, requires aws.textract.enabled=true)
ocr.provider=${OCR_PROVIDER:gcp}

# Medical Report Background Processing
medical-report.processing.thread-pool-size=20
medical-report.processing.queue-capacity=100
medical-report.processing.thread-ttl-seconds=600

# ---------------------------------------------------------------------------
# LLM provider for clinical insights and chat: groq | anthropic | openai | bedrock
# ---------------------------------------------------------------------------
llm.provider=${LLM_PROVIDER:groq}
llm.default-max-tokens=8192
llm.default-temperature=0.3
llm.timeout-seconds=120
llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
llm.anthropic.model=${ANTHROPIC_MODEL:claude-opus-5}
llm.anthropic.effort=${ANTHROPIC_EFFORT:medium}
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.base-url=https://api.groq.com/openai/v1
llm.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
# gpt-oss-120b is text-only: it rejects an array-shaped user message outright. The vision model is a
# separate client (baymax.extract.vision-model), so this flag stays false for the default Groq client.
llm.groq.supports-images=false
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.base-url=https://api.openai.com/v1
llm.openai.model=${OPENAI_MODEL:gpt-4o}

# ---------------------------------------------------------------------------
# Baymax module (DR-2): off unless BAYMAX_ENABLED=true. When on, its routes live
# under /api/v1/baymax/** and its own Flyway instance migrates schema `baymax`
# (classpath:db/baymax/migration) over the same JDBC connection MedScribe uses.
# The R2DBC search_path stays `medscribe`; Baymax tables are referenced schema-qualified.
# ---------------------------------------------------------------------------
baymax.enabled=${BAYMAX_ENABLED:false}
baymax.flyway.enabled=true
baymax.flyway.create-schemas=${BAYMAX_FLYWAY_CREATE_SCHEMAS:true}
baymax.flyway.url=${spring.flyway.url:}
baymax.flyway.user=${spring.flyway.user:}
baymax.flyway.password=${spring.flyway.password:}

# Baymax AI cost logging (BMX-1). List prices in USD per 1M tokens; a model with no entry is logged with a
# NULL cost and a WARN, never a guessed number. Model ids contain '/' and '.', hence the [brackets].
# Sources (checked 2026-09-12): Groq list price $0.15/$0.60 (gpt-oss-120b), Anthropic $5/$25 (claude-opus-5). Re-check when models change.
baymax.llm.prices.groq.[openai/gpt-oss-120b].input=0.15
baymax.llm.prices.groq.[openai/gpt-oss-120b].output=0.60
# The cheap VISION model, which is what actually runs when baymax.extract.send-images=true.
# Without this the extraction call logs a NULL cost and the document total silently understates.
# Rates from the Groq /v1/models pricing field, 2026-09-17: prompt 8.0e-7, completion 4.0e-6 per token.
baymax.llm.prices.groq.[qwen/qwen3.8-27b].input=0.80
baymax.llm.prices.groq.[qwen/qwen3.8-27b].output=4.00
# Anthropic list prices, USD per 1M tokens.
# Source: https://platform.claude.com/docs/en/about-claude/pricing — fetched 2026-09-17.
# Sonnet 5 is $2/$10, NOT the $3/$15 that Sonnet 4.6 charges: the increase scheduled for 2026-09-01
# was cancelled and the introductory rate became standard.
#
# Haiku is keyed BOTH bare and dated. The API echoes back `claude-haiku-4-5-20251001` even when the
# request said `claude-haiku-4-5`, and the cost log keys on what the response returns — so the bare
# key alone would log NULL cost on every cheap-tier call with only a WARN to show for it. Sonnet 5
# echoes its bare id, so it needs one key. Verified against the API 2026-09-17.
baymax.llm.prices.anthropic.[claude-haiku-4-5].input=1.00
baymax.llm.prices.anthropic.[claude-haiku-4-5].output=5.00
baymax.llm.prices.anthropic.[claude-haiku-4-5-20251001].input=1.00
baymax.llm.prices.anthropic.[claude-haiku-4-5-20251001].output=5.00
baymax.llm.prices.anthropic.[claude-sonnet-5].input=2.00
baymax.llm.prices.anthropic.[claude-sonnet-5].output=10.00
baymax.llm.prices.anthropic.[claude-opus-5].input=5.00
baymax.llm.prices.anthropic.[claude-opus-5].output=25.00
# Cloud Vision document text detection, USD per image (list price beyond the free tier)
baymax.vision.cost-per-image=0.0015
# Shared secret for /api/v1/baymax/admin/** (header X-Baymax-Admin-Token); admin routes answer 503 while unset
baymax.admin.token=${BAYMAX_ADMIN_TOKEN:}

# Baymax object storage (BMX-3): private S3-compatible bucket for page images and crops (AWS S3, Supabase
# Storage's S3 endpoint, MinIO locally). Blank bucket = not configured; the module loads, storage calls fail.
baymax.storage.endpoint=${BAYMAX_STORAGE_ENDPOINT:}
baymax.storage.region=${BAYMAX_STORAGE_REGION:ap-south-1}
baymax.storage.bucket=${BAYMAX_STORAGE_BUCKET:}
baymax.storage.access-key=${BAYMAX_STORAGE_ACCESS_KEY:}
baymax.storage.secret-key=${BAYMAX_STORAGE_SECRET_KEY:}
baymax.storage.path-style=${BAYMAX_STORAGE_PATH_STYLE:false}
# static (keys required) | instance-role (EC2 instance profile only, DR-5) | default-chain (AWS SDK default)
baymax.storage.credentials=${BAYMAX_STORAGE_CREDENTIALS:default-chain}
# x-amz-server-side-encryption value on every PUT; AES256 for AWS, blank for Supabase/MinIO (encrypted at rest anyway)
baymax.storage.server-side-encryption=${BAYMAX_STORAGE_SSE:AES256}
baymax.storage.signed-url-ttl=${BAYMAX_STORAGE_SIGNED_URL_TTL:PT15M}

# OTP login and web sessions (BMX-5). The HMAC secret stands in for phone numbers in otp_code, web_session and
# audit_event; blank = OTP login answers 503 (fail closed, like the admin token). Generate with `openssl rand -hex 32`.
# otp-delivery=log writes each code to the server log at INFO — v1 only; WhatsApp delivery is BMX-10.
baymax.auth.hmac-secret=${BAYMAX_AUTH_HMAC_SECRET:}
baymax.auth.otp-delivery=${BAYMAX_OTP_DELIVERY:log}
baymax.auth.otp-ttl=${BAYMAX_OTP_TTL:PT10M}
baymax.auth.otp-max-live-per-hour=${BAYMAX_OTP_MAX_LIVE_PER_HOUR:5}
baymax.auth.otp-max-attempts=${BAYMAX_OTP_MAX_ATTEMPTS:5}
baymax.auth.session-ttl=${BAYMAX_SESSION_TTL:P30D}
baymax.auth.cookie-secure=${BAYMAX_COOKIE_SECURE:true}

# Explanation, urgency and the review gate (BMX-6, DR-13). Urgency is computed in code from persisted values and
# printed reference ranges; the model never assigns it. gate-mode: off | all | urgency; reviewer during pilot is
# Tanvir (DR-13) — identity is config, delivery of the notification is the log until BMX-10.
baymax.outbound.public-base-url=${BAYMAX_PUBLIC_BASE_URL:https://baymax.eliooo.org}
baymax.outbound.gate-mode=${BAYMAX_GATE_MODE:off}
baymax.outbound.gate-urgency-levels=${BAYMAX_GATE_URGENCY_LEVELS:now,this_week}
baymax.outbound.max-chars=600
# STOPGAP critical band (PO ruling 2026-09-18): NOW when value >= 2.0 x ref_high, or <= 0.5 x ref_low, or the page's
# own text marks the value critical/panic/very high/very low. Replace with per-marker panic thresholds from a
# clinician before pilot week 0 (pending list).
baymax.outbound.critical-high-multiple=${BAYMAX_CRITICAL_HIGH_MULTIPLE:2.0}
baymax.outbound.critical-low-multiple=${BAYMAX_CRITICAL_LOW_MULTIPLE:0.5}

# Free tier (BMX-4): profiles per family and documents per UTC calendar month; plan=family is unlimited
baymax.free.max-patients=${BAYMAX_FREE_MAX_PATIENTS:1}
baymax.free.max-docs-per-month=${BAYMAX_FREE_MAX_DOCS_PER_MONTH:3}

# ---------------------------------------------------------------------------
# Extraction (BMX-2). Cheap path first; escalate to the strong model on low confidence or a critical flag.
# Groq text-only model stays openai/gpt-oss-120b (llm.groq.model); the vision model is separate because
# a text-only model rejects image content outright.
# ---------------------------------------------------------------------------
baymax.extract.send-images=${BAYMAX_EXTRACT_SEND_IMAGES:true}
# DR-10: extraction runs single-tier on claude-sonnet-5 for printed documents. Measured on the ten-document
# printed corpus (2026-09-17): haiku 60.0% at $0.0118/doc with two retakes, sonnet 86.2% at $0.0253 with
# none, and haiku's confidence (0.85–0.95 on every document) did not predict its gap to sonnet (0 to +0.60),
# so no escalation threshold recovered the gap for less than sonnet alone. Haiku stays configured and
# unused: set BAYMAX_EXTRACT_VISION_MODEL=claude-haiku-4-5 and a threshold below to bring the two-tier path
# back. Re-measure both on the handwritten batch before freezing.
# (DR-9 dropped Groq: its free tier caps OUTPUT at 1,000 tokens/minute against the ~1,810 one document
# declares, so every call 429s — one document per two minutes across all families. Groq stays in elioo-llm
# and in the config above, unused by Baymax.)
baymax.extract.vision-model=${BAYMAX_EXTRACT_VISION_MODEL:claude-sonnet-5}
# DR-8: sonnet, not opus. Opus measured $0.073-0.113/doc against a $0.15 per-document ceiling,
# leaving nothing for TTS, nudges and infra. Override per environment if a run needs opus.
baymax.extract.strong-model=${BAYMAX_EXTRACT_STRONG_MODEL:claude-sonnet-5}
baymax.extract.max-output-tokens=${BAYMAX_EXTRACT_MAX_OUTPUT_TOKENS:8192}
baymax.extract.min-confidence-overall=${BAYMAX_EXTRACT_MIN_CONFIDENCE_OVERALL:0.80}
baymax.extract.min-confidence-section=${BAYMAX_EXTRACT_MIN_CONFIDENCE_SECTION:0.70}
# 0.0 = confidence escalation off (DR-10); `confidence < 0.0` is never true. A `critical` flag still
# escalates, to the strong model above. Set e.g. 0.86 together with a haiku vision-model to re-enable.
baymax.extract.strong-model-threshold=${BAYMAX_EXTRACT_STRONG_MODEL_THRESHOLD:0.0}
baymax.extract.max-pages=${BAYMAX_EXTRACT_MAX_PAGES:10}
baymax.extract.crop-padding-px=${BAYMAX_EXTRACT_CROP_PADDING_PX:12}

# Canonical chronic markers for v1 trend detection. Config, not code: edit freely.
# Aliases are matched case-insensitively against the extracted value name, including common BD lab spellings.
baymax.markers[0].canonical=hba1c
baymax.markers[0].aliases=hba1c,hb a1c,glycated haemoglobin,glycosylated hemoglobin,a1c,hbaic
baymax.markers[1].canonical=fasting_glucose
baymax.markers[1].aliases=fasting glucose,fbs,fasting blood sugar,glucose fasting,blood sugar (fasting),sugar fasting
baymax.markers[2].canonical=creatinine
baymax.markers[2].aliases=creatinine,s. creatinine,serum creatinine,s creatinine,creat
baymax.markers[3].canonical=bp_systolic
baymax.markers[3].aliases=systolic,bp systolic,systolic bp,sbp
baymax.markers[4].canonical=bp_diastolic
baymax.markers[4].aliases=diastolic,bp diastolic,diastolic bp,dbp
baymax.markers[5].canonical=ldl
baymax.markers[5].aliases=ldl,ldl cholesterol,ldl-c,low density lipoprotein
baymax.markers[6].canonical=tsh
baymax.markers[6].aliases=tsh,thyroid stimulating hormone,s. tsh,serum tsh

#actuator
# Use standard /actuator path for Docker compatibility
# For custom path, use: /api/v1/notification/pfh/actuator
# DR-11: the MedScribe PoC (UI + API) lives under /medscribeai; Baymax serves /. Actuator stays at the root.
spring.webflux.static-path-pattern=/medscribeai/**
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
# Production restricts this to health,info in application-prod.properties
management.endpoints.web.exposure.include=*