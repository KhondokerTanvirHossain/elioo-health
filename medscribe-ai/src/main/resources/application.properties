spring.application.name=medscribe-ai
# Profile is set via SPRING_PROFILES_ACTIVE environment variable
# For local dev, uncomment and set to: local2,aws,gcp
# For production: prod,aws,gcp (set via environment variable)
spring.profiles.active=local2,aws,gcp

# WebFlux Configuration - Increase buffer size for large base64 images
spring.codec.max-in-memory-size=10MB

#micrometer tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

#log and logback
LOG_DIR=/tmp/logs
MAX_FILE_SIZE=15MB
MAX_HISTORY=20
LOG_LEVEL_ROOT=INFO

firebase.config.path=classpath:firebase/firebase-adminsdk.json

# OCR Provider Configuration
# Options: aws (default), gcp
# Default to AWS Textract unless overridden by profile
ocr.provider=gcp

# Medical Report Background Processing
medical-report.processing.thread-pool-size=20
medical-report.processing.queue-capacity=100
medical-report.processing.thread-ttl-seconds=600

#actuator
# Use standard /actuator path for Docker compatibility
# For custom path, use: /api/v1/notification/pfh/actuator
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*