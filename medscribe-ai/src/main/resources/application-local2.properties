server.port=8086

feature-flagging.base-url=http://localhost:8087

# ---------------------------------------------------------------------------
# Local database: the Postgres container from docker-compose.yml (port 5433).
# Override any of these with PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD.
# ---------------------------------------------------------------------------
PGHOST=localhost
PGPORT=5433
PGDATABASE=medscribe
PGUSER=medscribe
PGPASSWORD=medscribe
PGSCHEMA=medscribe

# Runtime connection (reactive)
spring.r2dbc.url=r2dbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?schema=${PGSCHEMA}
spring.r2dbc.username=${PGUSER}
spring.r2dbc.password=${PGPASSWORD}

# R2DBC Connection Pool (to support concurrent background processing)
spring.r2dbc.pool.initial-size=20
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-acquire-time=3s

# Schema migrations (JDBC, startup only). Applies src/main/resources/db/migration/V*.sql
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.flyway.user=${PGUSER}
spring.flyway.password=${PGPASSWORD}
spring.flyway.default-schema=${PGSCHEMA}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
