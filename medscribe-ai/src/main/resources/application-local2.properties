server.port=8086

feature-flagging.base-url=http://localhost:8087

# ---------------------------------------------------------------------------
# Local database: the Postgres container from docker-compose.yml (port 5433).
# Override any of these with PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD.
# ---------------------------------------------------------------------------
PGHOST=localhost
PGPORT=5433
PGDATABASE=medscribe
PGUSER=medscribe
PGPASSWORD=medscribe
PGSCHEMA=medscribe

# Runtime connection (reactive)
spring.r2dbc.url=r2dbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?schema=${PGSCHEMA}
spring.r2dbc.username=${PGUSER}
spring.r2dbc.password=${PGPASSWORD}

# R2DBC Connection Pool (to support concurrent background processing)
spring.r2dbc.pool.initial-size=20
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-acquire-time=3s

# Schema migrations (JDBC, startup only). Applies src/main/resources/db/migration/V*.sql
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.flyway.user=${PGUSER}
spring.flyway.password=${PGPASSWORD}
spring.flyway.default-schema=${PGSCHEMA}
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true

# Baymax is on for local development (schema `baymax` in the same local database)
baymax.enabled=${BAYMAX_ENABLED:true}

# Baymax object storage for local development: the MinIO service from docker-compose.yml (bucket `baymax`)
baymax.storage.endpoint=${BAYMAX_STORAGE_ENDPOINT:http://localhost:9000}
baymax.storage.region=${BAYMAX_STORAGE_REGION:us-east-1}
baymax.storage.bucket=${BAYMAX_STORAGE_BUCKET:baymax}
baymax.storage.access-key=${BAYMAX_STORAGE_ACCESS_KEY:minioadmin}
baymax.storage.secret-key=${BAYMAX_STORAGE_SECRET_KEY:minioadmin}
baymax.storage.server-side-encryption=${BAYMAX_STORAGE_SSE:}
baymax.storage.path-style=${BAYMAX_STORAGE_PATH_STYLE:true}
baymax.storage.credentials=${BAYMAX_STORAGE_CREDENTIALS:static}
