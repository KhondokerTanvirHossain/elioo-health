server.port=8086

feature-flagging.base-url=http://localhost:8087

# PostgreSQL R2DBC Configuration
#spring.r2dbc.url=r2dbc:postgresql://${PGHOST:localhost}:5432/pfh?schema=pfh
spring.r2dbc.url=r2dbc:postgresql://${PGHOST:localhost}:5432/medscribe?schema=medscribe
spring.r2dbc.username=${PGUSER:postgres}
spring.r2dbc.password=${PGPASSWORD:changeme}

# R2DBC Connection Pool (to support concurrent background processing)
spring.r2dbc.pool.initial-size=20
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-acquire-time=3s