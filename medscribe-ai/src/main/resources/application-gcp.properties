# GCP Configuration for MedScribe AI
# This profile contains GCP-specific settings for Google Cloud Vision API OCR

# ============================================================================
# OCR Provider Selection
# ============================================================================
# Options: aws (default), gcp
# This property determines which OCR adapter is active
ocr.provider=gcp

# ============================================================================
# GCP Common Configuration
# ============================================================================
# Enable GCP integration (required to activate GCP beans)
gcp.enabled=true

# GCP Project ID (required)
gcp.project-id=${GCP_PROJECT_ID:<YOUR_GCP_PROJECT>}

# GCP Credentials Configuration
# For local development: uses classpath resource
# For production: set GCP_CREDENTIALS_PATH env var or use GOOGLE_APPLICATION_CREDENTIALS
gcp.credentials-path=${GCP_CREDENTIALS_PATH:classpath:gcp/gcp-credentials.json}
# gcp.credentials-json=${GCP_CREDENTIALS_JSON}

# Retry configuration for GCP API calls
gcp.retry.max-attempts=3
gcp.retry.backoff-base-delay-ms=100
gcp.retry.backoff-max-delay-ms=10000

# ============================================================================
# Google Cloud Vision API Configuration
# ============================================================================
# Enable/disable Vision API integration
gcp.vision.enabled=true

# Minimum confidence threshold for accepting OCR results (0.0 - 1.0)
# Blocks with confidence below this threshold may be filtered out
gcp.vision.min-confidence-threshold=0.80

# Image size limits
# GCP Vision supports up to 20 MB (vs 10 MB for AWS Textract)
gcp.vision.max-image-size-mb=20
gcp.vision.min-image-size-mb=0.05

# Default language hints for OCR operations
# Comma-separated ISO 639-1 language codes
# Examples: "en", "bn,en", "hi,en"
# Default to Bangla + English for Bangladesh medical reports
gcp.vision.default-language-hints=bn,en

# Timeout for Vision API calls (milliseconds)
gcp.vision.timeout-ms=30000

# Maximum number of concurrent Vision API calls
gcp.vision.max-concurrent-calls=10

# Enable detailed logging for debugging
gcp.vision.enable-detailed-logging=false

# ============================================================================
# Google Cloud Translation API Configuration
# ============================================================================
# Enable/disable Translation API integration
gcp.translate.enabled=true

# Default source language for translation (null = auto-detect)
# Examples: "bn" (Bangla), "hi" (Hindi), null (auto-detect)
# For Bangladesh medical reports, default to Bangla
gcp.translate.default-source-language=bn

# Target language for translation (always English for AWS Comprehend)
gcp.translate.target-language=en

# Preserve English text as-is (don't re-translate)
# When true, text detected as English will skip translation
gcp.translate.preserve-english=true

# Translation model to use (null = GCP default NMT model)
# Options: null (recommended), "nmt", "base"
gcp.translate.model=

# Batch size for batch translation operations (1-100)
gcp.translate.batch-size=100

# Timeout for translation requests (seconds)
gcp.translate.timeout-seconds=30

# Number of retry attempts for failed translations
gcp.translate.retry-attempts=2

# MIME type for translation (text/plain or text/html)
gcp.translate.mime-type=text/plain

# Location/region for Translation API
gcp.translate.location=global

# ============================================================================
# Logging Configuration
# ============================================================================
# Enable DEBUG logging for GCP modules
logging.level.com.elioo.healthcare.gcp=DEBUG
logging.level.com.elioo.healthcare.medicalreport.adapter.out.gcp=INFO

# Enable DEBUG logging for Google Cloud libraries (caution: verbose)
# logging.level.com.google.cloud.vision=DEBUG

# ============================================================================
# Application Settings (inherited from base application.properties)
# ============================================================================
# These settings are inherited but can be overridden if needed
# spring.profiles.active=local2,gcp
