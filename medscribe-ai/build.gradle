/*
 * MedScribe AI Application Module
 *
 * Main Spring Boot application that orchestrates medical report processing.
 * This module will eventually depend on extracted AWS library modules.
 */

plugins {
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    // Spring Boot Web & Reactive
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    // Schema migrations: Flyway runs over JDBC at startup (spring.flyway.url),
    // independent of the R2DBC connection the app uses at runtime.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework:spring-jdbc'

    // Utilities
    implementation 'com.google.code.gson:gson:2.10.1'

    // Observability & Monitoring
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'com.github.maricn:logback-slack-appender:1.6.1'

    // AWS Service Libraries (via Spring Boot Starter)
    implementation project(':elioo-aws-spring-boot-starter')

    // GCP Service Libraries (via Spring Boot Starter)
    implementation project(':elioo-gcp-spring-boot-starter')

    // Provider-neutral LLM layer (Groq / Anthropic / OpenAI / Bedrock)
    implementation project(':elioo-llm')

    // Baymax module: same deployable, activated by baymax.enabled=true (DR-2)
    implementation project(':baymax')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:postgresql:1.19.7'
}

// Spring Boot configuration
springBoot {
    mainClass = 'com.elioo.healthcare.MedscribeAiApplication'
}

// ShippedSpringFrameworkVersionTest reads CI's bootJar: its BOOT-INF/lib is built from the production runtime
// classpath, which Gradle resolves apart from the test runtime classpath, so a check on the test classpath alone can
// pass while the jar ships another Framework. The image rebuilds this jar (the Dockerfile's own Gradle), and
// scripts/check-framework-jars.sh checks that one. It also gets the root override, to fail when Boot moves while it
// is set and to hold the linkage-checked versions only while there is a mixed BOM.
tasks.named('test') {
    def bootJarFile = tasks.named('bootJar').flatMap { it.archiveFile }
    dependsOn tasks.named('bootJar')
    inputs.file(bootJarFile).withPropertyName('shippedBootJar')
    def override = project.findProperty('spring-framework.version')
    inputs.property('springFrameworkOverride', override ?: '')
    doFirst {
        systemProperty 'shipped.bootJar', bootJarFile.get().asFile.absolutePath
        systemProperty 'spring-framework.override', override ?: ''
    }
}
