name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/khondokertanvirhossain/elioo-health/medscribe-ai

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medscribe
          POSTGRES_USER: medscribe
          POSTGRES_PASSWORD: medscribe
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U medscribe -d medscribe"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers pulls its images at test time, and a registry problem then fails the BUILD rather than
      # the pull: four acceptance tests — every one that needs MinIO — died with ContainerFetchException ->
      # ConditionTimeoutException, ~7 minutes each, on two consecutive runs, on a branch that touches no
      # container config. main was last green on 2026-09-23, so this blocks every merge, not one branch.
      #
      # Pre-pulling moves the failure to a step that SAYS WHY. Testcontainers reports only "fetch failed";
      # docker pull prints the registry's actual response. MinIO left Docker Hub, so its image comes from
      # quay.io — and pulling it from a laptop with no Docker Hub route returns "unauthorized", which could
      # be a MinIO access change or could be local, and the CI log could not tell the two apart.
      #
      # continue-on-error so this diagnoses without becoming a second way to block the build.
      - name: Pre-pull test container images
        continue-on-error: true
        run: |
          for image in \
            postgres:17-alpine \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            testcontainers/ryuk:0.7.0
          do
            echo "::group::docker pull $image"
            docker pull "$image" || echo "::warning::pull failed for $image (see output above for the registry's reason)"
            echo "::endgroup::"
          done
      - name: Build (unit tests + context test against service Postgres)
        run: ./gradlew build --no-daemon
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGDATABASE: medscribe
          PGUSER: medscribe
          PGPASSWORD: medscribe
          PGSCHEMA: medscribe
          # presence-only: the context test never calls the provider
          LLM_PROVIDER: groq
          GROQ_API_KEY: ci-placeholder
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test"

  deploy:
    name: Build image and deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Copy deploy.sh to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy.sh
          target: /home/ec2-user/
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" bash /home/ec2-user/deploy.sh
            docker logout ghcr.io
      - name: Smoke test from runner
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}:8086/actuator/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "Health check failed"; exit 1
