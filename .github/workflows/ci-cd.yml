name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/khondokertanvirhossain/elioo-health/medscribe-ai
  WEB_IMAGE: ghcr.io/khondokertanvirhossain/elioo-health/medioo-web

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Read-only token: this job runs third-party actions and the repo's own scripts, and writes nothing to GitHub.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: medscribe
          POSTGRES_USER: medscribe
          POSTGRES_PASSWORD: medscribe
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U medscribe -d medscribe"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # DR-36: a README told contributors never to commit real patient data, and the same commit broke the
      # rule — two real medical records then sat in a public repo for three weeks. Runs before the build so
      # it fails in seconds rather than after 30 minutes of tests.
      - name: Refuse undeclared test fixtures
        run: scripts/check-test-fixtures.sh
      # Flyway runs with outOfOrder=false and every merge deploys: a migration numbered at or below what main already
      # holds (two branches that each took "the next free number") stops the deployable at startup. Numbers are taken
      # at merge time; this fails the required check on the PR instead. test_check_migration_order.sh covers it both ways.
      - name: Refuse a migration numbered at or below main's
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          bash scripts/test_check_migration_order.sh
          bash scripts/check-migration-order.sh origin/main
      # Seven scripts. Every request goes only to 127.0.0.1; the route probe test also pulls the pinned Caddy image
      # (caddy:2.11.4-alpine, by digest) from Docker Hub and runs it locally, seven short-lived containers, each
      # waited for up to 30 s. test_deploy_is_tip.sh: the deploy job's tip check (below), tested
      # both ways against a throwaway repository. test_deploy_prune.sh: deploy.sh against a fake docker/curl/df/sleep
      # (scripts/deploy_test_fakes.sh) — the prune (only our repository, newest 3 by time, never the tag being
      # deployed or a running image, before the pull), the free-space floor, the function-only mode and the
      # `docker run` arguments. test_deploy_sh.sh: the two-container deploy (DR-40 A2) against the same fakes — Java
      # swapped and healthy before medioo-web is touched and untouched after its run, the web health probe EXECUTED
      # (the runner's node, a stub /app/healthz) for the right sha, image and service, the pull errors told apart
      # (missing tag = Java only, any other = red), a failed web swap puts the previous one back, no published port
      # and no --env-file for Node, both repositories pruned without the rollback target; from W1c, Java published on
      # 127.0.0.1 only and the routes floor enforced both ways (ROUTES_FLOOR_FORCE only). test_smoke_https.sh: the
      # deploy job's https smoke (below) against a local stub of the production table, every row broken alone,
      # duplicate security headers, a host that never answers. test_caddy_drift.sh: the deploy job's drift check
      # against fixture Caddyfiles, both ways (formatting ignored, unterminated blocks refused without a diff).
      # test_budget_replica.sh: the Caddy replica of the DR-42 enforcing run (W1d), only the address and upstreams
      # changed, and a source without production's encode or HSTS lines refused.
      # test_caddy_route_probe.sh: scripts/caddy-route-probe.sh runs the repo's Caddyfile.medioo in a real Caddy of the
      # box's version against every row of the smoke table (plan Wave 3, F0), both ways: a Caddy edit that sends a row
      # to the wrong upstream, or a matcher that reaches past its row (/app/preview*, /_next/*), fails on the PR.
      # Then `caddy validate` of Caddyfile.medioo as written (both site blocks, the real upstreams), in the same pinned
      # image the probe runs (read from the probe, never restated): the probe loads only a rewritten copy of the medioo
      # block, so this is the plan's Task F Step 4 validate on the box's version, on every PR.
      - name: Deploy script tests (tip check, prune, two containers, https smoke, Caddy drift, budget replica, route probe, validate)
        run: |
          scripts/test_deploy_is_tip.sh
          bash scripts/test_deploy_prune.sh
          bash scripts/test_deploy_sh.sh
          bash scripts/test_smoke_https.sh
          bash scripts/test_caddy_drift.sh
          bash scripts/test_budget_replica.sh
          bash scripts/test_caddy_route_probe.sh
          docker run --rm -v "$PWD/docs/infra/Caddyfile.medioo:/etc/caddy/Caddyfile:ro" \
            "$(sed -n 's/^CADDY_IMAGE="\(.*\)"$/\1/p' scripts/caddy-route-probe.sh)" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # The real medioo-web image, built from its Dockerfile, and deploy_web against the runner's Docker daemon (only
      # `docker pull` shimmed): the probe against the real Next server, `docker inspect` of what deploy.sh started
      # (no ports, 320m, rotated logs, exactly two env vars, one network), and an image built from another sha refused
      # with the previous container put back, and the catalog probe exiting 0 in the real image and non-zero against a
      # stand-in that serves a catalog (plan W2c). A Dockerfile break fails here, on the PR, not in the deploy job on main.
      - name: medioo-web image and deploy_web against a real daemon
        run: bash scripts/test_deploy_web_docker.sh
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers pulls its images at test time, and a registry problem then fails the BUILD rather than
      # the pull: four acceptance tests — every one that needs MinIO — died with ContainerFetchException ->
      # ConditionTimeoutException, ~7 minutes each, on two consecutive runs, on a branch that touches no
      # container config. main was last green on 2026-09-23, so this blocks every merge, not one branch.
      #
      # Pre-pulling moves the failure to a step that SAYS WHY. Testcontainers reports only "fetch failed";
      # docker pull prints the registry's actual response. MinIO left Docker Hub, so its image comes from
      # quay.io — and pulling it from a laptop with no Docker Hub route returns "unauthorized", which could
      # be a MinIO access change or could be local, and the CI log could not tell the two apart.
      #
      # continue-on-error so this diagnoses without becoming a second way to block the build.
      - name: Pre-pull test container images
        continue-on-error: true
        run: |
          for image in \
            postgres:17-alpine \
            docker.io/bitnamilegacy/minio@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20 \
            testcontainers/ryuk:0.7.0
          do
            echo "::group::docker pull $image"
            docker pull "$image" || echo "::warning::pull failed for $image (see output above for the registry's reason)"
            echo "::endgroup::"
          done
      - name: Build (unit tests + context test against service Postgres)
        run: ./gradlew build --no-daemon
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGDATABASE: medscribe
          PGUSER: medscribe
          PGPASSWORD: medscribe
          PGSCHEMA: medscribe
          # presence-only: the context test never calls the provider
          LLM_PROVIDER: groq
          GROQ_API_KEY: ci-placeholder
          # hotfix escape from the Graph expiry date gate only (RUNBOOK "Graph API version"); unset = gate on
          GRAPH_EXPIRY_GUARD_SKIP: ${{ vars.GRAPH_EXPIRY_GUARD_SKIP }}
      # The Spring Framework guard on the jar that SHIPS (#114). The Gradle build above tests CI's own bootJar; the image
      # rebuilds it with the Dockerfile's Gradle from only the files it copies, and scripts/check-framework-jars.sh
      # refuses that build's lib inside `docker build`. The deploy job builds the image only on main, so the builder
      # stage is built here too: a Docker-only regression (the image's Gradle, the COPY list, .dockerignore) fails the
      # PR, not main's deploy. Both steps run even when the Gradle build failed, so each guard reports on its own.
      # The check's cases run twice: on the runner, and in the Dockerfile's builder image (dash, mawk, its unzip),
      # the runtime the check really runs in. Each refusal is asserted by the rule that fired, both directions.
      - name: Framework jar check cases (runner and builder image)
        if: ${{ !cancelled() }}
        run: |
          scripts/test_check_framework_jars.sh
          builder=$(awk '$1 == "FROM" && $NF == "builder" { print $2 }' Dockerfile)
          test -n "$builder" || { echo "::error::no builder stage in Dockerfile"; exit 1; }
          docker run --rm -v "$PWD/scripts:/scripts:ro" "$builder" bash /scripts/test_check_framework_jars.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: ${{ !cancelled() }}
      # Read-only cache: main's deploy writes it (mode=max, so the builder layers are in it); a PR never writes, so it
      # cannot evict main's layers. Nothing is pushed or loaded.
      - name: Java image builder stage (the Framework check on the build that ships)
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          target: builder
          push: false
          cache-from: type=gha
      # D4: the add sheet's script (baymax/ui/upload.js) — its pure rules, including exactly what one press sends.
      # The DOM wiring and the ES5 parse are covered inside the Gradle build (UploadScriptTest); this runs the rest.
      # Node 22 for every node step: the medioo-web image runs node:22-alpine, so CI tests the runtime it ships.
      # Third-party actions are pinned by commit sha (a tag can be moved); the trailing comment names the version.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: medioo-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: medioo-web/pnpm-lock.yaml
      - name: Upload script tests
        run: node --test baymax/src/test/js/*.test.mjs
      # medioo-web (DR-40, plan W1a): built and tested here; the deploy job builds its image and runs it beside Java (W1b),
      # with no traffic until Caddy routes a path to it (W1c).
      # DR-40 A3, enforced here and in Java: no server action, no mutating route handler, Java fetched with GET/HEAD
      # only. The check's own cases run first (both directions, and a scan of zero files fails).
      - name: medioo-web server-mutation check
        run: |
          scripts/test_check_no_server_mutation.sh
          scripts/check-no-server-mutation.sh medioo-web/src
      - name: medioo-web install
        working-directory: medioo-web
        run: pnpm install --frozen-lockfile
      - name: medioo-web lint, typecheck, unit tests, build
        working-directory: medioo-web
        run: |
          pnpm run lint
          pnpm run lint:css
          pnpm run typecheck
          pnpm exec vitest run
          pnpm run build
          # the component catalog's build (MEDIOO_CATALOG=1, into .next-catalog/): served only to Playwright's catalog
          # project below; the image copies .next/standalone and never sees it (plan W2c)
          pnpm run build:catalog
          # after both builds: client-copy.built.test.ts reads the client chunks of each (plan W2d-a)
          pnpm run test:built
      # The browser download is cached per Playwright version and the install retried, so a CDN or apt-mirror hiccup
      # does not block every merge (main is protected and every merge deploys).
      - name: medioo-web Playwright version
        id: playwright
        working-directory: medioo-web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: medioo-web browser install
        working-directory: medioo-web
        run: |
          for attempt in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install failed (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
          exit 1
      # All three projects: phone and desktop against the production build (catalog-off.spec.ts: /app/catalog-test is a
      # 404 there), catalog against the catalog build (every component state: overflow, the rendered NOW red, axe,
      # 12 px, the wordmark per theme, CSP; both widths, both schemes).
      - name: medioo-web browser tests (CSP, axe, no-JS reading, budget ceilings, component catalog)
        working-directory: medioo-web
        run: pnpm exec playwright test -c e2e/playwright.config.ts
      - name: medioo-web budget numbers
        if: always()
        working-directory: medioo-web
        run: |
          node -e 'const d = require("./test-results/budget.json"); console.log(JSON.stringify({ totals: d.totals, all: d.all }, null, 2))' \
            || echo "no budget.json (the browser tests did not reach the probe)"
      # DR-42's enforcing run (plan W1d): the real medioo-web image behind a Caddy replica of docs/infra/Caddyfile.medioo
      # (its encode and header block, only the address and the upstreams changed), and budget.spec.ts against that Caddy
      # with E2E_VIA_CADDY=1: the probe within "probe" and every page of NEXT_PAGES within "route", read from
      # medioo-web/e2e/budget-ceilings.json, on the phone profile. Every measured document must carry the HSTS header
      # only that Caddy block sets, so a run that bypassed Caddy fails. The next start run above applies the same
      # ceilings and can only be stricter. Prints paths and byte counts only.
      - name: medioo-web budget ceilings behind Caddy (DR-42, the enforcing run)
        run: bash scripts/budget-behind-caddy.sh
      - name: Upload medioo-web Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: medioo-web-playwright-report
          path: medioo-web/playwright-report
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: "**/build/reports/tests/test"

  deploy:
    name: Build image and deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time: two merges landing close together queue here instead of running deploy.sh on the box at
    # once. Never cancelled: a deploy stopped halfway leaves the server between images, so the later one waits.
    # The group serializes deploys but does not order them, so the first step, run inside the group, lets only the
    # tip of main deploy (scripts/deploy-is-tip.sh): an older run that reaches the group late is skipped, green.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy only the tip of main
        id: tip
        run: scripts/deploy-is-tip.sh "${{ github.sha }}"
      - uses: docker/login-action@v3
        if: steps.tip.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.tip.outputs.current == 'true'
      - name: Build and push image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # medioo-web (DR-40 A1): same sha as the Java image, built here so deploy.sh can require it (WEB_IMAGE_REQUIRED=1
      # below). Built before anything reaches the box: a web build failure stops the job with production untouched.
      # Its own cache scope, so the Node layers never evict the Gradle ones.
      - name: Build and push medioo-web image
        if: steps.tip.outputs.current == 'true'
        uses: docker/build-push-action@v6
        with:
          context: medioo-web
          file: medioo-web/Dockerfile
          push: true
          # baked into the image as BUILD_SHA: /app/healthz reports it as `build`, and deploy.sh requires it to equal the
          # tag it deployed, so the health check proves which image runs (scripts/test_deploy_web_docker.sh)
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Copy deploy.sh to server
        if: steps.tip.outputs.current == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy.sh
          target: /home/ec2-user/
      - name: Deploy on server
        if: steps.tip.outputs.current == 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -e
            # logout on EVERY exit, before the login can leave anything behind: under set -e a failing deploy.sh
            # (Java unhealthy, web unhealthy, a web pull fault) would skip a trailing logout and leave this job's
            # token in ~/.docker/config.json on a box shared with n8n and bddrug. deploy.sh's exit code still fails the step.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # this job has just pushed medioo-web:<sha>, so a missing tag is a fault here, not a pre-W1b sha
            WEB_IMAGE_REQUIRED=1 IMAGE_TAG="$IMAGE_TAG" bash /home/ec2-user/deploy.sh
            # Java off the public port (W1c), asserted on what Docker actually publishes, not on deploy.sh's arguments:
            # exactly one mapping, on IPv4 loopback (no 0.0.0.0, no [::])
            published="$(docker port medscribe-ai)"
            if [ "$published" != "8086/tcp -> 127.0.0.1:8086" ]; then
              echo "::error::medscribe-ai publishes [$(printf '%s' "$published" | tr '\n' ';')], expected exactly [8086/tcp -> 127.0.0.1:8086]"
              exit 1
            fi
            echo "medscribe-ai publishes $published only"
      # The https upstream table (DR-40 A1, plan W1c), through Caddy, as a browser sees it: one row per path class
      # (Next's /app/healthz, Java's pages, the API, MedScribe, the /baymax redirects, the webhook refusal), with
      # each class's security headers (each sent exactly once), /_next/* still Java's, and the old hostname's 301.
      # Retried while Caddy reaches the new upstreams, within SMOKE_DEADLINE (90 s) for the whole run; the step's
      # timeout is the backstop. Only paths, status codes and header values are printed, never a body: this log is
      # public (DR-38) and the health body carries disk, path and database details.
      - name: Smoke test from runner (https table)
        if: steps.tip.outputs.current == 'true'
        timeout-minutes: 3
        run: bash scripts/smoke-https.sh https://medioo.eliooo.org
      # The other half of "Java off the public port" (W1c), from outside, on the real box: http://<EC2 host>:8086 must
      # not answer at all (curl's 000: refused or timed out). Anything that publishes 8086 again (a hand `docker run
      # -p 8086:8086` during an incident, an older deploy.sh, a compose file) turns this red while the https smoke
      # above stays green. Replayed before merge while 8086 was still open: it failed with HTTP 200.
      - name: Java does not answer on the public port
        if: steps.tip.outputs.current == 'true'
        timeout-minutes: 1
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 8 "http://${{ secrets.EC2_HOST }}:8086/actuator/health" || true)
          [ "$code" = 000 ] || { echo "::error::Java answers on public :8086 (HTTP $code)"; exit 1; }
          echo "public :8086 does not answer (curl: $code)"
      # Drift (plan W1c): the box's live medioo/baymax site blocks, read-only, against docs/infra/Caddyfile.medioo.
      # Runs on the box, so the other tenants' blocks (n8n, bddrug) never leave it; the output is our blocks' diff
      # only. Runs even when the smoke failed: a drifted Caddyfile is a likely reason for it. It compares the file the
      # CONTAINER reads, copied to a mode-600 temp file and removed on exit, and separately checks that it is the same
      # as the host file: a host file replaced by inode (sed -i, mv, rsync) leaves Caddy on the old one while the host
      # file looks right (RUNBOOK). What Caddy has actually loaded is checked by the smoke, which asks it.
      - name: Copy the Caddy drift check to server
        if: ${{ !cancelled() && steps.tip.outputs.current == 'true' }}
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: scripts/caddy-drift.sh,docs/infra/Caddyfile.medioo
          target: /home/ec2-user/medioo-ci/
      - name: Caddy drift check (box vs repo)
        if: ${{ !cancelled() && steps.tip.outputs.current == 'true' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -u
            live="$(mktemp)"
            trap 'rm -f "$live"' EXIT
            docker exec n8n-caddy-1 cat /etc/caddy/Caddyfile > "$live" || { echo "caddy-drift: could not read the container's Caddyfile"; exit 1; }
            rc=0
            bash /home/ec2-user/medioo-ci/scripts/caddy-drift.sh /home/ec2-user/medioo-ci/docs/infra/Caddyfile.medioo "$live" || rc=1
            if ! diff -q "$live" /home/ec2-user/n8n/Caddyfile >/dev/null; then
              echo "caddy-drift: the container's Caddyfile differs from the host file (inode replaced?): docs/RUNBOOK.md -> Routing a path to medioo-web, step 4"
              rc=1
            fi
            exit "$rc"
