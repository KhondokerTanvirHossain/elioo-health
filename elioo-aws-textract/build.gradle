/*
 * Elioo AWS Textract Module
 *
 * Generic OCR library for Amazon Textract integration.
 * Provides:
 * - Document text detection
 * - Document analysis (tables, forms, layout)
 * - Image quality validation
 * - Generic block parsing
 *
 * This library is domain-agnostic and can be used for any OCR use case.
 * Domain-specific parsing (e.g., medical test results) should be implemented
 * in the consuming application.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

version = '0.1.0'
description = 'AWS Textract OCR library for Elioo Healthcare'

dependencies {
    // Common AWS infrastructure
    api project(':elioo-aws-common')

    // AWS Textract SDK (BOM managed in parent)
    api 'software.amazon.awssdk:textract'

    // Spring Boot (for auto-configuration support)
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Reactive support (from common module)
    api 'io.projectreactor:reactor-core'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation project(':elioo-aws-common')
}

// Publishing configuration for JitPack
java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.elioo.healthcare'
            artifactId = 'elioo-aws-textract'
        }
    }
}
