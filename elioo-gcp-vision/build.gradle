/*
 * Elioo GCP Vision Module
 *
 * Google Cloud Vision API OCR library for document text extraction.
 * Provides:
 * - Document text detection (DOCUMENT_TEXT_DETECTION feature)
 * - Multi-language OCR with language hints
 * - Text block extraction with geometry information
 * - Image quality validation
 * - Generic text parsing
 *
 * This library is domain-agnostic and can be used for any OCR use case.
 * Domain-specific parsing (e.g., medical test results) should be implemented
 * in the consuming application.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

version = '0.1.0'
description = 'GCP Vision OCR library for Elioo Healthcare'

dependencies {
    // Common GCP infrastructure
    api project(':elioo-gcp-common')

    // Google Cloud Vision API (BOM managed by parent via elioo-gcp-common)
    api 'com.google.cloud:google-cloud-vision'

    // Spring Boot (for auto-configuration support)
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    annotationProcessor 'org.springframework.boot:spring-boot-autoconfigure-processor'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Reactive support (from common module)
    api 'io.projectreactor:reactor-core'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation project(':elioo-gcp-common')
}

// Publishing configuration for JitPack
java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.elioo.healthcare'
            artifactId = 'elioo-gcp-vision'
        }
    }
}
